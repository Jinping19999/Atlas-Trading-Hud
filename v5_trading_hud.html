<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V5 Adaptive Momentum HUD</title>
<style>
:root { color-scheme: dark; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050505; color:#eaeae8; font-family:-apple-system,system-ui,sans-serif; min-height:100vh; overflow:hidden; }
:root {
  --bg:#050505;--panel:#0c0c0e;--panel2:#101013;--line:#1d1d20;--lineHi:#2a2a2e;
  --text:#eaeae8;--dim:#7f7f80;--faint:#3d3d40;--accent:#9affc1;--red:#ff6b6b;--warm:#f5e9c8;--amber:#f5c07a;
  --serif:Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code',monospace;
  --sans:-apple-system,system-ui,sans-serif;
}
.scanlines { position:fixed; inset:0; pointer-events:none; z-index:9999; background:repeating-linear-gradient(180deg,rgba(255,255,255,0.012) 0 1px,transparent 1px 3px); }
.app { display:flex; flex-direction:column; height:100vh; position:relative; }
.header { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--line); position:relative; z-index:1; flex-shrink:0; }
.header-brand { display:flex; align-items:baseline; gap:14px; }
.header-brand .logo { font-family:var(--serif); font-size:22px; font-style:italic; }
.header-brand .logo .ast { color:var(--accent); }
.header-brand .path { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.18em; }
.header-nav { display:flex; gap:4px; }
.header-nav button { padding:8px 14px; border:0; background:transparent; color:var(--dim); font-family:var(--mono); font-size:11px; letter-spacing:.14em; cursor:pointer; border-bottom:1px solid transparent; }
.header-nav button.active { background:rgba(154,255,193,0.08); color:var(--accent); border-bottom:1px solid var(--accent); }
.header-nav button .badge { margin-left:6px; font-size:10px; color:var(--faint); }
.header-nav button.active .badge { color:var(--accent); }
.header-status { display:flex; gap:24px; font-family:var(--mono); font-size:11px; color:var(--dim); }
.header-status .dot { color:var(--accent); }
.header-status .dot.bear { color:var(--red); }
.main { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; overflow:hidden; }
.view { display:none; flex-direction:column; flex:1; min-height:0; overflow:auto; }
.view.active { display:flex; }

/* Screener */
.screener-header { padding:24px 28px 16px; display:flex; justify-content:space-between; align-items:flex-end; }
.screener-header .eyebrow { font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.22em; }
.screener-header h1 { margin:6px 0 0; font-family:var(--serif); font-size:46px; font-weight:400; letter-spacing:-.02em; line-height:1; }
.screener-header h1 .warm { font-style:italic; color:var(--warm); }
.screener-header .sub { margin-top:10px; font-size:13px; color:var(--dim); max-width:560px; }
.screener-stats { display:flex; gap:28px; }
.stat-block .stat-label { font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--dim); }
.stat-block .stat-value { margin-top:4px; font-family:var(--serif); font-size:24px; line-height:1; }
.stat-block .stat-value.accent { color:var(--accent); }
.stat-block .stat-sub { margin-top:4px; font-family:var(--mono); font-size:10.5px; color:var(--dim); }

.sector-strip { margin:0 28px 18px; display:flex; gap:6px; }
.sector-tile { flex:1; padding:8px 10px; border:1px solid var(--line); }
.sector-tile.top { border-color:var(--accent); background:rgba(154,255,193,0.06); }
.sector-tile .tile-head { display:flex; justify-content:space-between; align-items:baseline; }
.sector-tile .etf { font-family:var(--mono); font-size:12px; font-weight:600; }
.sector-tile.top .etf { color:var(--accent); }
.sector-tile .top-tag { font-family:var(--mono); font-size:9px; color:var(--accent); letter-spacing:.18em; }
.sector-tile .rs { font-family:var(--mono); font-size:11px; margin-top:2px; }
.sector-tile .rs.pos { color:var(--accent); }
.sector-tile .rs.neg { color:var(--red); }

.screener-body { display:flex; min-height:400px; padding:0 28px 28px; gap:16px; }
.signal-panel { flex:2.2; display:flex; flex-direction:column; min-width:0; }
.signal-header { display:grid; grid-template-columns:0.7fr 1.4fr 0.65fr 0.6fr 0.45fr 0.45fr 1fr 0.8fr 0.35fr; padding:10px 0; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--dim); }
.signal-list { overflow:auto; min-height:300px; }
.signal-row { display:grid; grid-template-columns:0.7fr 1.4fr 0.65fr 0.6fr 0.45fr 0.45fr 1fr 0.8fr 0.35fr; padding:18px 0; border-bottom:1px solid var(--line); align-items:center; cursor:pointer; }
.signal-row:hover { background:rgba(154,255,193,0.03); }
.signal-row.selected { background:rgba(154,255,193,0.05); }

.detail-rail { flex:0.8; background:var(--panel); border:1px solid var(--line); padding:24px; display:flex; flex-direction:column; min-width:260px; max-width:340px; overflow:auto; }
.detail-actions { display:flex; gap:8px; margin-top:14px; }
.detail-actions .btn { flex:1; padding:12px 14px; font-size:12.5px; font-family:var(--sans); font-weight:500; border:1px solid var(--line); cursor:pointer; letter-spacing:.02em; text-align:center; }
.detail-actions .btn.primary { background:var(--accent); color:#000; border-color:var(--accent); }
.detail-actions .btn.secondary { background:transparent; color:var(--text); }

/* Positions */
.slot-meter { display:flex; gap:8px; margin:0 28px 24px; }
.slot-card { flex:1; padding:18px; border:1px solid var(--line); background:var(--panel); }
.slot-card.empty { border-style:dashed; background:transparent; display:flex; align-items:center; justify-content:center; }
.trail-bar { margin-top:14px; height:4px; background:var(--line); position:relative; }
.trail-bar .tb-trail { position:absolute; top:-4px; width:1px; height:12px; background:var(--warm); }
.trail-bar .tb-last { position:absolute; top:-4px; right:0; width:1px; height:12px; background:var(--accent); }

.pos-table { flex:1; margin:0 28px 28px; border:1px solid var(--line); background:var(--panel); overflow:auto; }
.pos-table-head { display:grid; grid-template-columns:1fr .7fr .7fr .7fr .7fr .7fr .6fr .6fr .7fr .5fr; padding:12px 18px; font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.16em; border-bottom:1px solid var(--line); background:var(--panel2); }
.pos-table-row { display:grid; grid-template-columns:1fr .7fr .7fr .7fr .7fr .7fr .6fr .6fr .7fr .5fr; padding:18px; border-bottom:1px solid var(--line); align-items:center; }

/* Backtest */
.period-toggle { display:flex; gap:6px; }
.period-toggle button { padding:10px 16px; border:1px solid var(--line); background:transparent; color:var(--text); font-family:var(--mono); font-size:11px; letter-spacing:.14em; cursor:pointer; }
.period-toggle button.active { border-color:var(--accent); background:rgba(154,255,193,0.06); color:var(--accent); }
.kpi-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--line); margin:0 28px 24px; border:1px solid var(--line); }
.kpi-cell { background:var(--panel); padding:18px 20px; }
.kpi-cell .kpi-label { font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.18em; }
.kpi-cell .kpi-value { margin-top:6px; font-family:var(--serif); font-size:30px; line-height:1; }
.kpi-cell .kpi-sub { margin-top:4px; font-family:var(--mono); font-size:10.5px; color:var(--dim); }
.backtest-charts { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin:0 28px 24px; }
.chart-panel { background:var(--panel); border:1px solid var(--line); padding:20px; }

.trade-ledger { margin:0 28px 28px; background:var(--panel); border:1px solid var(--line); }
.tl-cols { display:grid; grid-template-columns:40px 1fr .8fr .8fr .5fr .7fr .7fr .7fr; padding:10px 20px; font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.16em; border-bottom:1px solid var(--line); }
.tl-row { display:grid; grid-template-columns:40px 1fr .8fr .8fr .5fr .7fr .7fr .7fr; padding:10px 20px; font-family:var(--mono); font-size:12px; border-bottom:1px solid var(--line); align-items:center; }

/* Monitor */
.monitor-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; margin:0 28px 24px; }
.monitor-card { background:var(--panel); border:1px solid var(--line); padding:18px 20px; position:relative; }
.monitor-card.winner { border-left:3px solid var(--accent); }
.monitor-card.loser { border-left:3px solid var(--red); }
.monitor-card .mc-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.monitor-card .mc-ticker { font-family:var(--serif); font-size:24px; }
.monitor-card .mc-pnl { font-family:var(--mono); font-size:18px; font-weight:600; }
.monitor-card .mc-meta { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; font-family:var(--mono); font-size:11px; }
.monitor-card .mc-meta .mc-k { font-size:9px; color:var(--dim); letter-spacing:.14em; }
.monitor-card .mc-meta .mc-v { margin-top:2px; }
.monitor-card .mc-flags { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.monitor-card .mc-flag { padding:2px 8px; font-family:var(--mono); font-size:9px; letter-spacing:.1em; border:1px solid var(--line); }
.monitor-card .mc-flag.hit { border-color:var(--red); color:var(--red); }
.monitor-card .mc-flag.ok { border-color:var(--accent); color:var(--accent); }
.monitor-card .mc-remove { position:absolute; top:8px; right:10px; background:none; border:none; color:var(--dim); font-size:14px; cursor:pointer; padding:4px; }
.monitor-card .mc-remove:hover { color:var(--red); }
.monitor-summary { display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--line); margin:0 28px 20px; border:1px solid var(--line); }
.monitor-summary .ms-cell { background:var(--panel); padding:14px 16px; }
.monitor-summary .ms-label { font-family:var(--mono); font-size:9px; color:var(--dim); letter-spacing:.16em; }
.monitor-summary .ms-value { margin-top:4px; font-family:var(--serif); font-size:24px; line-height:1; }
.archive-row { display:grid; grid-template-columns:60px 1fr .6fr .6fr .5fr .5fr .6fr; padding:10px 20px; font-family:var(--mono); font-size:12px; border-bottom:1px solid var(--line); align-items:center; }
.archive-header { display:grid; grid-template-columns:60px 1fr .6fr .6fr .5fr .5fr .6fr; padding:10px 20px; font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.14em; border-bottom:1px solid var(--line); }

/* Strategy */
.pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; border:1px solid var(--accent); color:var(--accent); background:rgba(154,255,193,0.08); }
.strategy-body { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin:0 28px 28px; }
.rules-panel { background:var(--panel); border:1px solid var(--line); }
.rule-row { padding:18px 20px; border-bottom:1px solid var(--line); }
.rule-row:last-child { border-bottom:none; }
.toggle { width:48px; height:24px; padding:0; border:1px solid var(--line); background:transparent; position:relative; cursor:pointer; flex-shrink:0; }
.toggle.on { border-color:var(--accent); background:var(--accent); }
.toggle .knob { position:absolute; top:2px; width:18px; height:18px; background:var(--dim); transition:left .15s; }
.toggle.on .knob { left:26px; background:#000; }
.toggle:not(.on) .knob { left:2px; }

/* Loading */
.loading-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,5,5,0.92); z-index:100; gap:12px; }
.spinner { width:24px; height:24px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.14em; }
.load-phase { font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.1em; margin-top:4px; }
.progress-bar { width:200px; height:3px; background:var(--line); margin-top:8px; }
.progress-bar .fill { height:100%; background:var(--accent); transition:width .3s; }

/* Scan button */
.scan-btn { padding:12px 28px; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.18em; border:1px solid var(--accent); background:rgba(154,255,193,0.06); color:var(--accent); cursor:pointer; transition:all .15s; }
.scan-btn:hover { background:rgba(154,255,193,0.14); box-shadow:0 0 12px rgba(154,255,193,0.15); }
.scan-btn:active { background:rgba(154,255,193,0.22); }
.scan-btn:disabled { opacity:0.4; cursor:not-allowed; box-shadow:none; }
.scan-btn.running { animation:pulse-btn 1.2s ease-in-out infinite; }
@keyframes pulse-btn { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Settings bar */
select, input[type="text"] { outline:none; }
select:focus, input[type="text"]:focus { border-color:var(--accent); }
select option { background:var(--panel); color:var(--text); }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="app" id="app">
  <header class="header">
    <div class="header-brand">
      <span class="logo"><span class="ast">※</span> Atlas</span>
      <span class="path">/ V5 ADAPTIVE MOMENTUM · Jin Ping Lim</span>
    </div>
    <nav class="header-nav" id="nav"></nav>
    <div class="header-status">
      <span>REGIME <span class="dot" id="regimeDot">● --</span></span>
      <span>FEED <span class="dot">● LIVE</span></span>
      <span id="sectorCacheInfo" style="cursor:pointer" title="Click to clear sector cache"></span>
      <span id="clock">NY --:--:--</span>
    </div>
  </header>
  <main class="main" id="main"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// V5 STRATEGY PARAMETERS (validated through backtesting)
// ═══════════════════════════════════════════════════════════════════════
const RS_THRESHOLD = 0.08;
const RSI_LOW = 40;
const RSI_HIGH = 70;
const ATR_STOP_MULT = 2.5;
const TRAIL_ATR_MULT = 0.5;
const VOL_CONVICTION = 1.25;
const SECTOR_LOOKBACK = 63;
const SIGNAL_PERSIST_DAYS = 3; // signals stay visible for 3 trading days
let TOP_N_SECTORS = parseInt(localStorage.getItem('v5_hud_topN'))||2;

// ═══════════════════════════════════════════════════════════════════════
// SETTINGS PERSISTENCE
// ═══════════════════════════════════════════════════════════════════════
function loadPersonalWatchlist(){return (localStorage.getItem('v5_hud_personal')||'').split(',').map(t=>t.trim().toUpperCase()).filter(t=>t.length>1);}
function savePersonalWatchlist(tickers){localStorage.setItem('v5_hud_personal',tickers.join(','));}
function saveTopN(n){localStorage.setItem('v5_hud_topN',n);TOP_N_SECTORS=n;}

// ═══════════════════════════════════════════════════════════════════════
// SIGNAL HISTORY (persistence across days)
// ═══════════════════════════════════════════════════════════════════════
const SIGNAL_HISTORY_KEY = 'v5_hud_signal_history';

function getTradingDate(){
  const d=new Date();
  // If weekend, use Friday's date
  if(d.getDay()===0)d.setDate(d.getDate()-2);
  if(d.getDay()===6)d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function loadSignalHistory(){
  try{
    const raw=localStorage.getItem(SIGNAL_HISTORY_KEY);
    if(!raw)return {};
    return JSON.parse(raw);
  }catch{return {};}
}

function saveSignalHistory(history){
  try{localStorage.setItem(SIGNAL_HISTORY_KEY,JSON.stringify(history));}catch{}
}

// Record today's signals into history
function recordSignals(todaySignals){
  const today=getTradingDate();
  const history=loadSignalHistory();
  // Add/update today's signals
  for(const sig of todaySignals){
    if(!history[sig.tk]){
      history[sig.tk]={firstSeen:today,lastSeen:today,daysSeen:[today],lastData:sig};
    } else {
      history[sig.tk].lastSeen=today;
      history[sig.tk].lastData=sig;
      if(!history[sig.tk].daysSeen.includes(today))history[sig.tk].daysSeen.push(today);
    }
  }
  // Prune entries older than 10 trading days (generous buffer)
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-14);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  for(const tk of Object.keys(history)){
    if(history[tk].lastSeen<cutoffStr)delete history[tk];
  }
  saveSignalHistory(history);
  return history;
}

// Merge today's fresh signals with recent historical signals
function mergeWithHistory(todaySignals){
  const today=getTradingDate();
  const history=loadSignalHistory();
  const todayTickers=new Set(todaySignals.map(s=>s.tk));
  const merged=[];

  // Today's signals = FRESH
  for(const sig of todaySignals){
    const hist=history[sig.tk];
    const age=hist&&hist.firstSeen!==today?tradingDaysBetween(hist.firstSeen,today):0;
    merged.push({...sig, signalAge:0, firstSeen:hist?hist.firstSeen:today,
      ageLabel:'FRESH', stillValid:true, consecutiveDays:hist?hist.daysSeen.length:1});
  }

  // Historical signals not in today's scan = FADING (still within grace period)
  for(const [tk,hist] of Object.entries(history)){
    if(todayTickers.has(tk))continue;
    const age=tradingDaysBetween(hist.lastSeen,today);
    if(age>0&&age<=SIGNAL_PERSIST_DAYS){
      merged.push({...hist.lastData, signalAge:age, firstSeen:hist.firstSeen,
        ageLabel:age===1?'DAY 2':age===2?'DAY 3':'DAY '+String(age+1),
        stillValid:false, consecutiveDays:hist.daysSeen.length});
    }
  }

  return merged;
}

// Approximate trading days between two date strings
function tradingDaysBetween(dateA,dateB){
  const a=new Date(dateA+'T12:00:00'),b=new Date(dateB+'T12:00:00');
  if(a>=b)return 0;
  let count=0;
  const d=new Date(a);
  while(d<b){
    d.setDate(d.getDate()+1);
    if(d.getDay()!==0&&d.getDay()!==6)count++;
  }
  return count;
}

// ═══════════════════════════════════════════════════════════════════════
// SIGNAL MONITOR (forward-test tracker)
// ═══════════════════════════════════════════════════════════════════════
const MONITOR_KEY = 'v5_hud_monitor';
const ARCHIVE_KEY = 'v5_hud_monitor_archive';
const MONITOR_DAYS = 60;

/*  Position schema:
  { tk, sec, entryPx, entryDate, stopPx, trailPx, conv, rs21Entry, rsiEntry,
    pricePath: [{d:'2026-05-16',c:123.45},...],  // daily closes since entry
    currentPx, maxPx, minPx, daysHeld, pnlPct, maxGainPct, maxDDPct,
    stopHit, trailHit, rsStillValid, status:'active'|'archived' }
*/

function loadMonitor(){
  try{const raw=localStorage.getItem(MONITOR_KEY);return raw?JSON.parse(raw):[];}catch{return [];}
}
function saveMonitor(positions){
  try{localStorage.setItem(MONITOR_KEY,JSON.stringify(positions));}catch{}
}
function loadArchive(){
  try{const raw=localStorage.getItem(ARCHIVE_KEY);return raw?JSON.parse(raw):[];}catch{return [];}
}
function saveArchive(archive){
  try{
    // Keep last 100 archived positions
    if(archive.length>100)archive=archive.slice(-100);
    localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive));
  }catch{}
}

function addToMonitor(signal){
  const positions=loadMonitor();
  // Don't duplicate
  if(positions.find(p=>p.tk===signal.tk&&p.status==='active'))return false;
  const pos={
    tk:signal.tk, sec:signal.sec||'XLK', entryPx:signal.px, entryDate:getTradingDate(),
    stopPx:signal.stop, trailPx:signal.trail, conv:signal.conv,
    rs21Entry:signal.rs21, rsiEntry:signal.rsi,
    pricePath:[{d:getTradingDate(),c:signal.px}],
    currentPx:signal.px, maxPx:signal.px, minPx:signal.px,
    daysHeld:0, pnlPct:0, maxGainPct:0, maxDDPct:0,
    stopHit:false, trailHit:false, rsStillValid:true, status:'active'
  };
  positions.push(pos);
  saveMonitor(positions);
  return true;
}

function removeFromMonitor(ticker){
  let positions=loadMonitor();
  positions=positions.filter(p=>p.tk!==ticker);
  saveMonitor(positions);
}

// Auto-add all FRESH signals from a scan
function autoTrackFreshSignals(freshSignals){
  const positions=loadMonitor();
  const activeTickers=new Set(positions.filter(p=>p.status==='active').map(p=>p.tk));
  let added=0;
  for(const sig of freshSignals){
    if(!activeTickers.has(sig.tk)){
      addToMonitor(sig);
      added++;
    }
  }
  return added;
}

// Update monitor positions with latest price data from cache
function updateMonitorPositions(){
  const positions=loadMonitor();
  const today=getTradingDate();
  const toArchive=[];
  const remaining=[];

  for(const pos of positions){
    if(pos.status!=='active'){remaining.push(pos);continue;}

    // Try to get latest price from cache
    const cached=_priceCache[pos.tk];
    if(cached&&cached.data&&cached.data.length>0){
      const bars=cached.data;
      const lastBar=bars[bars.length-1];
      const lastClose=lastBar.c;
      pos.currentPx=lastClose;
      pos.maxPx=Math.max(pos.maxPx,lastClose);
      pos.minPx=Math.min(pos.minPx,lastClose);
      pos.pnlPct=+((lastClose/pos.entryPx-1)*100).toFixed(2);
      pos.maxGainPct=+((pos.maxPx/pos.entryPx-1)*100).toFixed(2);
      pos.maxDDPct=+((pos.minPx/pos.entryPx-1)*100).toFixed(2);

      // Update price path (one entry per trading day)
      const lastPathDate=pos.pricePath.length>0?pos.pricePath[pos.pricePath.length-1].d:null;
      if(lastPathDate!==today){
        pos.pricePath.push({d:today,c:lastClose});
      } else {
        pos.pricePath[pos.pricePath.length-1].c=lastClose;
      }

      // Check stop and trail
      if(lastClose<=pos.stopPx)pos.stopHit=true;

      // EMA21 trail check
      const closes=bars.map(b=>b.c);
      if(closes.length>=21){
        const ema21=computeEMA(closes,21);
        const ema21Val=ema21[ema21.length-1];
        if(lastClose<ema21Val)pos.trailHit=true;
        pos.trailPx=+(ema21Val-TRAIL_ATR_MULT*computeATR(bars.map(b=>b.h),bars.map(b=>b.l),closes,14)).toFixed(2);
      }

      // RS check
      if(closes.length>=22){
        const spyCached=_priceCache['SPY'];
        if(spyCached&&spyCached.data){
          const spyCloses=spyCached.data.map(b=>b.c);
          const stockRet=closes[closes.length-1]/closes[closes.length-22]-1;
          const spyRet=spyCloses[spyCloses.length-1]/spyCloses[spyCloses.length-22]-1;
          pos.rsStillValid=(stockRet-spyRet)>=RS_THRESHOLD;
        }
      }
    }

    pos.daysHeld=tradingDaysBetween(pos.entryDate,today);

    // Archive if 60 days reached
    if(pos.daysHeld>=MONITOR_DAYS){
      pos.status='archived';
      pos.archiveDate=today;
      toArchive.push(pos);
    } else {
      remaining.push(pos);
    }
  }

  saveMonitor(remaining);

  if(toArchive.length>0){
    const archive=loadArchive();
    archive.push(...toArchive);
    saveArchive(archive);
  }

  return {active:remaining.filter(p=>p.status==='active'),archived:loadArchive()};
}

function computeEMA(closes,span){const k=2/(span+1);let ema=[closes[0]];for(let i=1;i<closes.length;i++)ema.push(closes[i]*k+ema[i-1]*(1-k));return ema;}
function computeRSI(closes,period=14){let gains=[],losses=[];for(let i=1;i<closes.length;i++){const d=closes[i]-closes[i-1];gains.push(d>0?d:0);losses.push(d<0?-d:0);}const alpha=1/period;let avgGain=gains.slice(0,period).reduce((a,b)=>a+b,0)/period;let avgLoss=losses.slice(0,period).reduce((a,b)=>a+b,0)/period;let rsi=[];for(let i=0;i<=period;i++)rsi.push(null);rsi.push(avgLoss===0?100:100-100/(1+avgGain/avgLoss));for(let i=period;i<gains.length;i++){avgGain=avgGain*(1-alpha)+gains[i]*alpha;avgLoss=avgLoss*(1-alpha)+losses[i]*alpha;rsi.push(avgLoss===0?100:100-100/(1+avgGain/avgLoss));}return rsi;}
function computeATR(highs,lows,closes,period=14){let trs=[];for(let i=1;i<closes.length;i++)trs.push(Math.max(highs[i]-lows[i],Math.abs(highs[i]-closes[i-1]),Math.abs(lows[i]-closes[i-1])));let avg=trs.slice(0,period).reduce((a,b)=>a+b,0)/period;const alpha=1/period;for(let i=period;i<trs.length;i++)avg=avg*(1-alpha)+trs[i]*alpha;return avg;}

const PRICE_CACHE_KEY = 'v5_hud_price_cache';
const PRICE_CACHE_TTL = 30*60*1000;
const PRICE_CACHE_MAX_ENTRIES = 200; // prevent localStorage bloat

const PRICE_CACHE_STALE_TTL = 48*60*60*1000; // keep stale data for 48h (covers weekends)

function loadPriceCache(){
  try{
    const raw=localStorage.getItem(PRICE_CACHE_KEY);
    if(!raw)return {};
    const stored=JSON.parse(raw);
    const now=Date.now();
    const valid={};
    // Keep entries up to 48h (stale but usable as fallback on weekends)
    for(const [ticker,entry] of Object.entries(stored)){
      if(entry&&entry.ts&&(now-entry.ts<PRICE_CACHE_STALE_TTL)){valid[ticker]=entry;}
    }
    return valid;
  }catch{return {};}
}

function isCacheFresh(entry){
  return entry&&entry.ts&&(Date.now()-entry.ts<PRICE_CACHE_TTL);
}

function savePriceCache(cache){
  try{
    const keys=Object.keys(cache);
    // If over max, keep most recent entries
    if(keys.length>PRICE_CACHE_MAX_ENTRIES){
      const sorted=keys.sort((a,b)=>cache[b].ts-cache[a].ts);
      const trimmed={};
      for(let i=0;i<PRICE_CACHE_MAX_ENTRIES;i++){trimmed[sorted[i]]=cache[sorted[i]];}
      localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify(trimmed));
      return;
    }
    localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify(cache));
  }catch(e){
    // localStorage full — clear old cache and try once more
    try{localStorage.removeItem(PRICE_CACHE_KEY);localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify(cache));}catch{}
  }
}

// Load persisted cache on startup
let _priceCache = loadPriceCache();
// Periodic save (every 20 new entries)
let _priceCacheDirty = 0;
function cachePut(ticker,data){
  _priceCache[ticker]={data,ts:Date.now()};
  _priceCacheDirty++;
  if(_priceCacheDirty>=20){savePriceCache(_priceCache);_priceCacheDirty=0;}
}

function deepParse(val){if(typeof val==='string'){try{return deepParse(JSON.parse(val));}catch{return val;}}if(val&&typeof val==='object'){if('isError' in val&&val.isError)return{_error:true};if('result' in val)return deepParse(val.result);if('content' in val&&Array.isArray(val.content)&&val.content.length>0){if(val.content[0].text)return deepParse(val.content[0].text);}}return val;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// Adaptive throttle — slows down when errors accumulate
let _throttleMs = 350;
let _consecutiveErrors = 0;
const THROTTLE_MIN = 300;
const THROTTLE_MAX = 3000;
const THROTTLE_STEP = 200;

function adaptThrottle(success){
  if(success){_consecutiveErrors=0;_throttleMs=Math.max(THROTTLE_MIN,_throttleMs-30);}
  else{_consecutiveErrors++;_throttleMs=Math.min(THROTTLE_MAX,_throttleMs+THROTTLE_STEP*_consecutiveErrors);}
}

// Debug log for diagnosing failures (last 30 entries)
let _fetchLog=[];
function logFetch(ticker,attempt,outcome,detail){
  _fetchLog.push({t:Date.now(),ticker,attempt,outcome,detail:String(detail).slice(0,120)});
  if(_fetchLog.length>30)_fetchLog.shift();
}

async function fetchAggregates(ticker, limit=65){
  // 1. Fresh cache hit — return immediately
  const cached=_priceCache[ticker];
  if(cached&&isCacheFresh(cached)){liveState.fetchStats.cached++;return cached.data;}

  // 2. Try API
  const to=new Date(),from=new Date();
  from.setDate(from.getDate()-Math.round(limit*1.7));
  const fromStr=from.toISOString().slice(0,10),toStr=to.toISOString().slice(0,10);

  for(let attempt=1;attempt<=2;attempt++){
    try{
      await sleep(_throttleMs);
      const raw=await window.cowork.callMcpTool('mcp__polygon__polygon_aggregates',{params:{ticker,from_date:fromStr,to_date:toStr,timespan:'day',adjusted:true,limit:150,response_format:'json'}});
      const parsed=deepParse(raw);

      // Check for explicit error
      if(parsed&&parsed._error){
        logFetch(ticker,attempt,'ERROR','isError flag in response');
        adaptThrottle(false);
        if(attempt<2){await sleep(2000);continue;}
        break; // fall through to stale cache
      }

      // Check for rate limit / error status in Polygon response
      if(parsed&&typeof parsed==='object'&&parsed.status==='ERROR'){
        logFetch(ticker,attempt,'RATE_LIMIT',parsed.error||parsed.message||'status=ERROR');
        adaptThrottle(false);
        if(attempt<2){await sleep(3000);continue;}
        break; // fall through to stale cache
      }

      // Extract results array
      let results=null;
      if(parsed&&parsed.results&&Array.isArray(parsed.results))results=parsed.results;
      else if(Array.isArray(parsed))results=parsed;
      else if(parsed&&parsed.resultsCount===0){
        logFetch(ticker,attempt,'NO_DATA','resultsCount=0');
        liveState.fetchStats.ok++;
        adaptThrottle(true);
        return null;
      }

      if(results&&results.length>=20){
        const sorted=results.sort((a,b)=>a.t-b.t);
        cachePut(ticker,sorted);
        liveState.fetchStats.ok++;
        adaptThrottle(true);
        logFetch(ticker,attempt,'OK',results.length+' bars');
        return sorted;
      }

      if(results&&results.length>0&&results.length<20){
        logFetch(ticker,attempt,'PARTIAL',results.length+' bars (need 20)');
        liveState.fetchStats.ok++;
        adaptThrottle(true);
        return null;
      }

      logFetch(ticker,attempt,'EMPTY','parsed type: '+typeof parsed+' keys: '+(parsed?Object.keys(parsed).slice(0,5).join(','):'null'));
      if(attempt<2){adaptThrottle(false);await sleep(1500);continue;}
      break; // fall through to stale cache

    }catch(e){
      logFetch(ticker,attempt,'EXCEPTION',e.message||e);
      adaptThrottle(false);
      if(attempt<2){await sleep(2500);continue;}
      break; // fall through to stale cache
    }
  }

  // 3. STALE CACHE FALLBACK — use old data rather than losing the ticker
  if(cached&&cached.data){
    logFetch(ticker,0,'STALE_CACHE','using cached data from '+new Date(cached.ts).toLocaleTimeString());
    liveState.fetchStats.cached++;
    return cached.data;
  }

  liveState.fetchStats.failed++;
  return null;
}

  if(liveState.scanRunning)return;
  try{
  liveState.scanRunning=true; liveState.scanProgress=0;
  liveState.scanPhase='Connecting to backend...';
  liveState.fetchStats={ok:0,failed:0,cached:0}; render();

  // Build request body
  const personalTickers=loadPersonalWatchlist();
  const body={force:false, top_n:TOP_N_SECTORS, personal_watchlist:personalTickers};

  liveState.scanPhase='Scanning S&P 500 (backend)...'; liveState.scanProgress=10; render();

  const resp=await fetch(`${API_BASE}/v5/scan`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),
  });

  if(!resp.ok){
    const err=await resp.text();
    throw new Error(`API ${resp.status}: ${err}`);
  }

  const data=await resp.json();
  liveState.scanProgress=80; liveState.scanPhase='Processing results...'; render();

  // ── Map API response into liveState ──────────────────────────────
  liveState.regime=data.regime;
  liveState.sectors=data.sectors;

  // Update entry rules display
  const topSectors=data.sectors.filter(s=>s.top).map(s=>s.etf);
  ENTRY_RULES[5].v=topSectors.join(' · ');
  ENTRY_RULES[4].v=(data.regime?.state||'?')+' regime';

  // Signals — record to history and merge for persistence
  const signals=data.signals||[];
  recordSignals(signals);
  const mergedSignals=mergeWithHistory(signals);
  mergedSignals.sort((a,b)=>{
    if(a.stillValid&&!b.stillValid)return -1;
    if(!a.stillValid&&b.stillValid)return 1;
    if(a.signalAge!==b.signalAge)return a.signalAge-b.signalAge;
    return b.rs21-a.rs21;
  });
  liveState.signals=mergedSignals;

  // Weekly performers
  liveState.weeklyPerformers=data.weeklyPerformers||[];

  // Personal watchlist
  liveState.personalSignals=data.personalSignals||[];
  liveState.personalStatus=data.personalStatus||[];

  // Auto-track fresh signals in monitor
  liveState.scanProgress=95; liveState.scanPhase='Updating monitor...'; render();
  const freshSignalsOnly=mergedSignals.filter(s=>s.stillValid);
  const tracked=autoTrackFreshSignals(freshSignalsOnly);
  updateMonitorPositions();

  // Final status
  liveState.scanRunning=false;
  liveState.scanProgress=100;
  const freshCount=mergedSignals.filter(s=>s.stillValid).length;
  const fadingCount=mergedSignals.filter(s=>!s.stillValid).length;
  const meta=data.meta||{};
  const barLabel=meta.market_closed?`EOD ${meta.bar_date||''}`:`Pre-close ${meta.bar_date||''}`;
  liveState.scanPhase=`${barLabel} · ${meta.universe_size||'?'} tickers · ${freshCount} fresh${fadingCount>0?' + '+fadingCount+' persisted':''}${(data.personalSignals||[]).length>0?' + '+data.personalSignals.length+' personal':''}${tracked>0?' · '+tracked+' tracked':''} (${meta.duration_seconds||'?'}s)`;
  liveState.lastScan=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  liveState.fetchStats.ok=1;
  render();
  }catch(scanErr){
    console.error('Scan error:',scanErr);
    liveState.scanRunning=false;
    liveState.scanPhase=`Scan crashed: ${scanErr.message}`;
    render();
  }
}

function renderSparkBars(data,color='#9affc1',w=120,h=28){
  if(!data||!Array.isArray(data)||data.length===0)return`<svg width="${w}" height="${h}" style="display:block"><text x="${w/2}" y="${h/2+4}" text-anchor="middle" font-size="9" fill="#555">—</text></svg>`;
  const max=Math.max(...data);if(max===0)return`<svg width="${w}" height="${h}" style="display:block"></svg>`;
  const bw=w/data.length;
  let r='';data.forEach((v,i)=>{const bh=(v/max)*(h-2);r+=`<rect x="${i*bw+.5}" y="${h-bh}" width="${bw-1}" height="${bh}" fill="${color}" opacity="${(.4+.6*(i/data.length)).toFixed(2)}"/>`;});
  return`<svg width="${w}" height="${h}" style="display:block">${r}</svg>`;
}
function renderGauge(value,max=100,color='#9affc1'){
  const r=22,c=2*Math.PI*r,pct=Math.min(value/max,1);
  return`<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="#1d1d20" stroke-width="3"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 28 28)" stroke-linecap="round"/><text x="28" y="32" text-anchor="middle" font-size="13" font-family="var(--mono)" font-weight="600" fill="#eaeae8">${value}</text></svg>`;
}
function renderEquityChart(strategy,benchmark,h=260){
  const w=800,pad={l:56,r:16,t:24,b:32};const allV=[...strategy.map(p=>p.v),...(benchmark||[]).map(p=>p.v)];
  const max=Math.max(...allV),min=Math.min(...allV,80);
  const xs=(i,n)=>pad.l+(i/(n-1))*(w-pad.l-pad.r);const ys=v=>pad.t+(1-(v-min)/(max-min))*(h-pad.t-pad.b);
  const lp=arr=>arr.map((p,i)=>`${i?'L':'M'}${xs(i,arr.length).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ');
  const fp=arr=>`${lp(arr)} L${xs(arr.length-1,arr.length).toFixed(1)},${ys(min).toFixed(1)} L${xs(0,arr.length).toFixed(1)},${ys(min).toFixed(1)} Z`;
  const ticks=4;const yL=Array.from({length:ticks+1},(_,i)=>min+(max-min)*(i/ticks));
  let g='';yL.forEach(y=>{g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${ys(y)}" y2="${ys(y)}" stroke="#1d1d20" stroke-dasharray="2 4"/><text x="${pad.l-8}" y="${ys(y)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="#7f7f80">${y.toFixed(0)}</text>`;});
  let bl='';if(benchmark)bl=`<path d="${lp(benchmark)}" fill="none" stroke="#7f7f80" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9affc1" stop-opacity="0.18"/><stop offset="100%" stop-color="#9affc1" stop-opacity="0"/></linearGradient></defs>${g}${bl}<path d="${fp(strategy)}" fill="url(#eqfill)"/><path d="${lp(strategy)}" fill="none" stroke="#9affc1" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function renderDrawdownChart(data,h=90){
  const w=800,pad={l:56,r:16,t:8,b:16};const minDd=Math.min(...data.map(p=>p.dd||0),-25);
  const xs=i=>pad.l+(i/(data.length-1))*(w-pad.l-pad.r);const ys=v=>pad.t+(1-(v-minDd)/(0-minDd))*(h-pad.t-pad.b);
  const lp=data.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(p.dd||0).toFixed(1)}`).join(' ');
  const fp=`${lp} L${xs(data.length-1).toFixed(1)},${ys(0).toFixed(1)} L${xs(0).toFixed(1)},${ys(0).toFixed(1)} Z`;
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><line x1="${pad.l}" x2="${w-pad.r}" y1="${ys(0)}" y2="${ys(0)}" stroke="#1d1d20"/><line x1="${pad.l}" x2="${w-pad.r}" y1="${ys(-20)}" y2="${ys(-20)}" stroke="#ff6b6b" stroke-dasharray="2 4" opacity="0.5"/><text x="${pad.l-8}" y="${ys(0)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="#7f7f80">0%</text><text x="${pad.l-8}" y="${ys(-20)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="#ff6b6b">−20%</text><path d="${fp}" fill="#ff6b6b" fill-opacity="0.18"/><path d="${lp}" fill="none" stroke="#ff6b6b" stroke-width="1.4"/></svg>`;
}
function renderHistogram(data,h=200){
  const w=600,pad={l:24,r:16,t:16,b:28};const max=Math.max(...data.map(d=>d.count));const bw=(w-pad.l-pad.r)/data.length;
  let bars='';data.forEach((d,i)=>{const bh=(d.count/max)*(h-pad.t-pad.b);const x=pad.l+i*bw+4;const isL=d.bucket.startsWith('-');const col=isL?'#ff6b6b':'#9affc1';
  bars+=`<rect x="${x}" y="${h-pad.b-bh}" width="${bw-8}" height="${bh}" fill="${col}" opacity="0.85"/><text x="${x+(bw-8)/2}" y="${h-pad.b-bh-6}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="${col}">${d.count}</text><text x="${x+(bw-8)/2}" y="${h-8}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="#7f7f80">${d.bucket}</text>`;});
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">${bars}</svg>`;
}

function renderMonitorSparkline(pricePath,entryPx,w=140,h=36){
  if(!pricePath||pricePath.length<2)return `<svg width="${w}" height="${h}" style="display:block"><text x="${w/2}" y="${h/2+4}" text-anchor="middle" font-size="9" fill="#555">awaiting data</text></svg>`;
  const prices=pricePath.map(p=>p.c);
  const min=Math.min(...prices,entryPx);const max=Math.max(...prices,entryPx);
  const range=max-min||1;
  const xStep=w/(prices.length-1);
  const points=prices.map((p,i)=>`${(i*xStep).toFixed(1)},${(h-((p-min)/range)*(h-4)-2).toFixed(1)}`).join(' ');
  const entryY=(h-((entryPx-min)/range)*(h-4)-2).toFixed(1);
  const lastPx=prices[prices.length-1];
  const color=lastPx>=entryPx?'var(--accent)':'var(--red)';
  return `<svg width="${w}" height="${h}" style="display:block">
    <line x1="0" y1="${entryY}" x2="${w}" y2="${entryY}" stroke="var(--dim)" stroke-width="0.5" stroke-dasharray="3,3"/>
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"/>
    <circle cx="${((prices.length-1)*xStep).toFixed(1)}" cy="${(h-((lastPx-min)/range)*(h-4)-2).toFixed(1)}" r="2.5" fill="${color}"/>
  </svg>`;
}

      <div class="rules-panel">
        <div style="padding:14px 20px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em">ENTRY RULES — ALL MUST PASS</div>
        ${ENTRY_RULES.map((r,i)=>`<div class="rule-row"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px"><div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:var(--mono);font-size:10px;color:var(--faint)">0${i+1}</span><span style="font-family:var(--serif);font-size:22px;${!ruleStates[i]?'color:var(--faint)':''}">${r.k}</span>${r.pri?'<span style="display:inline-flex;padding:2px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;border:1px solid var(--warm);color:var(--warm)">★ PRIMARY</span>':''}</div><div style="margin-top:6px;font-size:13px;color:var(--dim);line-height:1.5">${r.desc}</div><div style="margin-top:10px;font-family:var(--mono);font-size:11px;color:${ruleStates[i]?'var(--accent)':'var(--faint)'};letter-spacing:.08em">CURRENT: <span style="color:${ruleStates[i]?'var(--text)':'var(--faint)'}">${r.v}</span></div></div><button class="toggle${ruleStates[i]?' on':''}" data-rule="${i}"><span class="knob"></span></button></div></div>`).join('')}
      </div>
      <div>
        <div style="background:var(--panel);border:1px solid var(--line);padding:20px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em;margin-bottom:14px">POSITION SIZING</div>
          <div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--warm)">CONVICTION</span><span style="font-family:var(--serif);font-size:24px;color:var(--warm)">${convPct}<span style="font-size:14px;color:var(--dim)">% equity</span></span></div><input type="range" min="0.5" max="3" step="0.5" value="${convPct}" data-slider="conv" style="width:100%;margin-top:8px;accent-color:var(--accent)"><div style="font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px">3-bar pullback OR rvol ≥ 1.25×</div></div>
          <div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--mono);font-size:11px;letter-spacing:.14em">BASE</span><span style="font-family:var(--serif);font-size:24px">${basePct}<span style="font-size:14px;color:var(--dim)">% equity</span></span></div><input type="range" min="0.5" max="3" step="0.5" value="${basePct}" data-slider="base" style="width:100%;margin-top:8px;accent-color:var(--accent)"><div style="font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px">standard RS-only entry</div></div>
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--mono);font-size:11px;letter-spacing:.14em">MAX POSITIONS</span><span style="font-family:var(--serif);font-size:24px">${maxPos}<span style="font-size:14px;color:var(--dim)"> · ${(maxPos*convPct).toFixed(0)}% worst case</span></span></div><input type="range" min="1" max="10" step="1" value="${maxPos}" data-slider="maxpos" style="width:100%;margin-top:8px;accent-color:var(--accent)"></div>
        </div>
        <div style="background:var(--panel);border:1px solid var(--line);padding:20px;margin-top:16px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em;margin-bottom:12px">EXIT RULES</div>
          ${[{k:'INITIAL STOP',v:'Entry − 2.5×ATR(14)'},{k:'TRAILING STOP',v:'EMA21 − 0.5×ATR(14) · only moves up'},{k:'TREND EXIT',v:'Daily close < EMA21'},{k:'TIME STOP',v:'None — momentum needs time',muted:true}].map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px"><span style="font-family:var(--mono);font-size:10.5px;color:${r.muted?'var(--faint)':'var(--dim)'};letter-spacing:.14em">${r.k}</span><span style="font-family:var(--mono);color:${r.muted?'var(--faint)':'var(--text)'};text-align:right">${r.v}</span></div>`).join('')}
        </div>
        <div style="background:var(--panel);border:1px solid var(--line);padding:20px;margin-top:16px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em;margin-bottom:12px">STRATEGY EVOLUTION</div>
          ${VERSIONS.map(v=>`<div style="display:grid;grid-template-columns:40px 1fr 1fr;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline"><span style="font-family:var(--serif);font-size:18px;color:${v.v==='V5'?'var(--accent)':'var(--faint)'}">${v.v}</span><span style="font-family:var(--mono);font-size:11px;color:${v.v==='V5'?'var(--text)':'var(--dim)'}">${v.change}</span><span style="font-family:var(--mono);font-size:10.5px;color:${v.v==='V5'?'var(--accent)':'var(--dim)'};text-align:right">${v.result}</span></div>`).join('')}
        </div>
      </div>
    </div>`;
}

function render(){
  renderNav();
  const main=document.getElementById('main');
  let html='';
  switch(currentView){
    case'screener':html=renderScreener();break;
    case'monitor':html=renderMonitor();break;
    case'positions':html=renderPositions();break;
    case'backtest':html=renderBacktest();break;
    case'strategy':html=renderStrategy();break;
  }
  main.innerHTML=`<div class="view active">${html}</div>`;
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll('.signal-row').forEach(row=>row.addEventListener('click',()=>{selectedTicker=row.dataset.tk;render();}));
  document.querySelectorAll('.period-toggle button').forEach(btn=>btn.addEventListener('click',()=>{backtestPeriod=btn.dataset.period;render();}));
  document.querySelectorAll('.toggle[data-rule]').forEach(btn=>btn.addEventListener('click',()=>{ruleStates[+btn.dataset.rule]=!ruleStates[+btn.dataset.rule];render();}));
  document.querySelectorAll('input[data-slider]').forEach(sl=>sl.addEventListener('input',()=>{if(sl.dataset.slider==='conv')convPct=+sl.value;if(sl.dataset.slider==='base')basePct=+sl.value;if(sl.dataset.slider==='maxpos')maxPos=+sl.value;render();}));
  const scanBtn=document.getElementById('scanBtn');
  if(scanBtn)scanBtn.addEventListener('click',()=>runLiveScan());
  // Fetch log viewer
  const fsd=document.getElementById('fetchStatsDisplay');
  if(fsd)fsd.addEventListener('click',()=>{
    const logHtml=_fetchLog.length===0?'No fetch log yet.':_fetchLog.map(l=>`<div style="font-size:10px;padding:2px 0;border-bottom:1px solid var(--line);color:${l.outcome==='OK'?'var(--accent)':l.outcome==='PARTIAL'||l.outcome==='NO_DATA'?'var(--dim)':'var(--red)'}"><b>${l.ticker}</b> #${l.attempt} → ${l.outcome} · ${l.detail}</div>`).join('');
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)';
    modal.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);padding:20px;max-width:600px;max-height:70vh;overflow:auto;width:90%"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.18em;margin-bottom:12px">FETCH LOG (last ${_fetchLog.length})</div>${logHtml}<div style="margin-top:14px;text-align:right"><button onclick="this.closest('div[style*=fixed]').remove()" style="padding:6px 14px;border:1px solid var(--line);background:transparent;color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer">CLOSE</button></div></div>`;
    document.body.appendChild(modal);
  });
  // Top-N selector
  const topNSel=document.getElementById('topNSelect');
  if(topNSel)topNSel.addEventListener('change',()=>{saveTopN(parseInt(topNSel.value));});
  // Personal watchlist input — save on blur/enter
  const pwInput=document.getElementById('personalInput');
  if(pwInput){
    pwInput.addEventListener('blur',()=>{const tks=pwInput.value.split(/[,\s]+/).map(t=>t.trim().toUpperCase()).filter(t=>t.length>1);savePersonalWatchlist(tks);});
    pwInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'){pwInput.blur();}});
  }
  // Add to Monitor button
  const addMonBtn=document.getElementById('addMonitorBtn');
  if(addMonBtn&&selectedTicker){
    const sig=liveState.signals.find(s=>s.tk===selectedTicker);
    if(sig){
      const alreadyTracked=loadMonitor().find(p=>p.tk===selectedTicker&&p.status==='active');
      if(alreadyTracked){addMonBtn.textContent='✓ Tracking';addMonBtn.style.opacity='0.5';addMonBtn.disabled=true;}
      addMonBtn.addEventListener('click',()=>{
        if(addToMonitor(sig)){addMonBtn.textContent='✓ Tracked';addMonBtn.style.opacity='0.5';renderNav();}
      });
    }
  }
  // Monitor remove buttons
  document.querySelectorAll('.mc-remove').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    removeFromMonitor(btn.dataset.tk);
    render();
  }));
  // Monitor manual add input
  const monAddInput=document.getElementById('monitorAddInput');
  const monAddBtn=document.getElementById('monitorAddBtn');
  if(monAddBtn&&monAddInput){
    monAddBtn.addEventListener('click',()=>{
      const tk=monAddInput.value.trim().toUpperCase();
      if(tk.length>0){
        // Create a minimal signal for manual add
        const cached=_priceCache[tk];
        const px=cached&&cached.data?cached.data[cached.data.length-1].c:0;
        addToMonitor({tk,sec:getSector(tk)||'XLK',px,stop:px*0.9,trail:px*0.95,conv:'MANUAL',rs21:0,rsi:0,spark:[]});
        monAddInput.value='';
        render();
      }
    });
    monAddInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')monAddBtn.click();});
  }
}

// Clock
function updateClock(){const now=new Date();const ny=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);document.getElementById('clock').textContent=`NY ${ny}`;}
setInterval(updateClock,1000);updateClock();

// Initial render + auto-scan
render();
// Auto-run scan on page load (calls backend API)
setTimeout(()=>{runLiveScan();},1000);
</script>
</body>
</html>
