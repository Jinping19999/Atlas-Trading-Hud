<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas - V5 Adaptive Momentum</title>
<style>
:root { color-scheme: dark; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0f1a; color:#f0f0ee;
  font-family:-apple-system,system-ui,'Inter',sans-serif;
  min-height:100vh; overflow:hidden;
}
:root {
  --bg:#0a0f1a;--panel:#111827;--border:#1e293b;
  --text:#f0f0ee;--dim:#6b7280;--faint:#374151;
  --green:#34d399;--red:#f87171;--blue:#60a5fa;--amber:#fbbf24;
  --mono:'SF Mono',ui-monospace,'Cascadia Code',monospace;
  --sans:-apple-system,system-ui,'Inter',sans-serif;
}

/* Layout */
.app { display:flex; flex-direction:column; height:100vh; }
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; height:44px; border-bottom:1px solid var(--border);
  flex-shrink:0; font-family:var(--mono); font-size:12px;
}
.header-left { display:flex; align-items:center; gap:24px; }
.header-brand { font-size:14px; font-weight:700; letter-spacing:.04em; color:var(--text); }
.header-nav { display:flex; gap:0; }
.header-nav button {
  padding:12px 16px; border:0; background:transparent; color:var(--dim);
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; cursor:pointer;
  border-bottom:2px solid transparent; transition:color .15s;
}
.header-nav button:hover { color:var(--text); }
.header-nav button.active { color:var(--text); border-bottom-color:var(--blue); }
.header-right { display:flex; align-items:center; gap:16px; font-size:11px; color:var(--dim); }
.regime-pill {
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 10px; border-radius:10px; font-size:10px; letter-spacing:.08em;
}
.regime-pill.bull { background:rgba(52,211,153,0.12); color:var(--green); }
.regime-pill.bear { background:rgba(248,113,113,0.12); color:var(--red); }
.regime-pill.unknown { background:rgba(107,114,128,0.12); color:var(--dim); }

/* Main content */
.main { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.view { display:none; flex-direction:column; flex:1; min-height:0; overflow:auto; padding:16px 24px 24px; }
.view.active { display:flex; }

/* Sector chips */
.sector-bar { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.sector-chip {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; font-family:var(--mono); font-size:11px;
  border:1px solid var(--border); border-radius:3px; color:var(--dim);
}
.sector-chip.top { border-color:var(--green); color:var(--green); background:rgba(52,211,153,0.06); }
.sector-chip .chip-rs { font-weight:600; }
.sector-chip .chip-rs.pos { color:var(--green); }
.sector-chip .chip-rs.neg { color:var(--red); }

/* Filter chips */
.filter-bar { display:flex; gap:6px; align-items:center; margin-bottom:12px; }
.filter-chip {
  padding:4px 12px; font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  border:1px solid var(--border); background:transparent; color:var(--dim);
  cursor:pointer; border-radius:3px; transition:all .12s;
}
.filter-chip:hover { color:var(--text); border-color:var(--faint); }
.filter-chip.active { background:rgba(96,165,250,0.1); border-color:var(--blue); color:var(--blue); }

/* Settings row */
.settings-row {
  display:flex; gap:16px; align-items:center; margin-bottom:12px; flex-wrap:wrap;
  font-family:var(--mono); font-size:11px; color:var(--dim);
}
.settings-row select, .settings-row input[type="text"] {
  padding:4px 8px; background:var(--panel); border:1px solid var(--border);
  color:var(--text); font-family:var(--mono); font-size:11px; outline:none; border-radius:2px;
}
.settings-row select:focus, .settings-row input[type="text"]:focus { border-color:var(--blue); }
select option { background:var(--panel); color:var(--text); }

/* Signal table */
.signal-table { width:100%; border-collapse:collapse; }
.signal-table th {
  text-align:left; font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:.1em; color:var(--dim); padding:8px 8px 8px 0;
  border-bottom:1px solid var(--border); cursor:pointer; user-select:none;
  white-space:nowrap;
}
.signal-table th:hover { color:var(--text); }
.signal-table th .sort-arrow { margin-left:4px; font-size:9px; color:var(--blue); }
.signal-table th.right { text-align:right; padding-right:0; }
.signal-table td {
  padding:10px 8px 10px 0; border-bottom:1px solid var(--border);
  font-size:13px; vertical-align:middle;
}
.signal-table td.right { text-align:right; padding-right:0; }
.signal-table td.mono { font-family:var(--mono); }
.signal-table tr.signal-row { cursor:pointer; transition:background .1s; }
.signal-table tr.signal-row:hover { background:rgba(96,165,250,0.04); }

/* Status badges */
.status-badge {
  display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
  padding:2px 6px; border-radius:2px; font-weight:600;
}
.status-badge.fresh { background:rgba(52,211,153,0.12); color:var(--green); }
.status-badge.day2 { background:rgba(251,191,36,0.12); color:var(--amber); }
.status-badge.day3 { background:rgba(55,65,81,0.3); color:var(--faint); }

/* Conviction pill */
.conv-pill {
  display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
  padding:2px 8px; border-radius:2px; border:1px solid;
}
.conv-pill.conviction { border-color:var(--green); color:var(--green); }
.conv-pill.base { border-color:var(--faint); color:var(--dim); }

/* Inline expand */
.signal-expand {
  background:var(--panel); border-bottom:1px solid var(--border);
}
.signal-expand td { padding:16px 0 16px 0; }
.expand-grid {
  display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px;
  font-family:var(--mono); font-size:12px;
}
.expand-grid .eg-label { font-size:10px; color:var(--dim); letter-spacing:.1em; margin-bottom:4px; }
.expand-grid .eg-value { font-size:14px; }

/* Scan button */
.scan-btn {
  padding:6px 18px; font-family:var(--mono); font-size:11px; font-weight:600;
  letter-spacing:.1em; border:1px solid var(--blue); background:rgba(96,165,250,0.08);
  color:var(--blue); cursor:pointer; border-radius:3px; transition:all .12s;
}
.scan-btn:hover { background:rgba(96,165,250,0.16); }
.scan-btn:disabled { opacity:0.4; cursor:not-allowed; }
.scan-btn.running { animation:pulse-btn 1.2s ease-in-out infinite; }
@keyframes pulse-btn { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Loading overlay */
.loading-overlay {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:rgba(10,15,26,0.92);
  z-index:100; gap:10px;
}
.spinner {
  width:20px; height:20px; border:2px solid var(--border);
  border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { font-family:var(--mono); font-size:11px; color:var(--dim); }
.progress-bar { width:180px; height:2px; background:var(--border); border-radius:1px; }
.progress-bar .fill { height:100%; background:var(--blue); transition:width .3s; border-radius:1px; }

/* Monitor cards */
.monitor-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; margin-bottom:16px; }
.monitor-card {
  background:var(--panel); border:1px solid var(--border); padding:16px;
  border-radius:4px; position:relative;
}
.monitor-card.winner { border-left:3px solid var(--green); }
.monitor-card.loser { border-left:3px solid var(--red); }
.monitor-card .mc-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.monitor-card .mc-ticker { font-size:18px; font-weight:700; }
.monitor-card .mc-pnl { font-family:var(--mono); font-size:16px; font-weight:600; }
.monitor-card .mc-meta { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; font-family:var(--mono); font-size:11px; }
.monitor-card .mc-meta .mc-k { font-size:9px; color:var(--dim); letter-spacing:.1em; }
.monitor-card .mc-meta .mc-v { margin-top:2px; }
.monitor-card .mc-flags { display:flex; gap:4px; margin-top:10px; flex-wrap:wrap; }
.monitor-card .mc-flag {
  padding:2px 6px; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  border:1px solid var(--border); border-radius:2px;
}
.monitor-card .mc-flag.hit { border-color:var(--red); color:var(--red); }
.monitor-card .mc-flag.ok { border-color:var(--green); color:var(--green); }
.monitor-card .mc-remove {
  position:absolute; top:8px; right:8px; background:none; border:none;
  color:var(--dim); font-size:14px; cursor:pointer; padding:4px; line-height:1;
}
.monitor-card .mc-remove:hover { color:var(--red); }

/* Summary strip */
.summary-strip {
  display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
  background:var(--border); margin-bottom:16px; border:1px solid var(--border); border-radius:4px; overflow:hidden;
}
.summary-strip .ss-cell { background:var(--panel); padding:12px 14px; }
.summary-strip .ss-label { font-family:var(--mono); font-size:9px; color:var(--dim); letter-spacing:.12em; }
.summary-strip .ss-value { margin-top:4px; font-family:var(--mono); font-size:20px; font-weight:600; line-height:1; }

/* KPI strip */
.kpi-strip {
  display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
  background:var(--border); margin-bottom:16px; border:1px solid var(--border); border-radius:4px; overflow:hidden;
}
.kpi-cell { background:var(--panel); padding:14px 16px; }
.kpi-cell .kpi-label { font-family:var(--mono); font-size:9px; color:var(--dim); letter-spacing:.12em; }
.kpi-cell .kpi-value { margin-top:4px; font-family:var(--mono); font-size:26px; font-weight:600; line-height:1; }
.kpi-cell .kpi-sub { margin-top:4px; font-family:var(--mono); font-size:10px; color:var(--dim); }

/* Charts */
.chart-grid { display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-bottom:16px; }
.chart-panel { background:var(--panel); border:1px solid var(--border); padding:16px; border-radius:4px; }

/* Period toggle */
.period-toggle { display:flex; gap:4px; }
.period-toggle button {
  padding:6px 14px; border:1px solid var(--border); background:transparent;
  color:var(--dim); font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  cursor:pointer; border-radius:3px;
}
.period-toggle button.active { border-color:var(--blue); background:rgba(96,165,250,0.08); color:var(--blue); }

/* Trade ledger */
.ledger-table { width:100%; border-collapse:collapse; margin-bottom:16px; }
.ledger-table th {
  text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  color:var(--dim); padding:8px 8px 8px 0; border-bottom:1px solid var(--border);
}
.ledger-table th.right { text-align:right; padding-right:0; }
.ledger-table td {
  padding:8px 8px 8px 0; border-bottom:1px solid var(--border);
  font-family:var(--mono); font-size:12px;
}
.ledger-table td.right { text-align:right; padding-right:0; }

/* Strategy rules */
.rules-grid { display:grid; grid-template-columns:1.3fr 1fr; gap:12px; }
.rules-panel { background:var(--panel); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
.rule-row { padding:14px 16px; border-bottom:1px solid var(--border); }
.rule-row:last-child { border-bottom:none; }
.toggle {
  width:40px; height:20px; padding:0; border:1px solid var(--border);
  background:transparent; position:relative; cursor:pointer; flex-shrink:0; border-radius:10px;
}
.toggle.on { border-color:var(--green); background:var(--green); }
.toggle .knob {
  position:absolute; top:2px; width:14px; height:14px;
  background:var(--dim); border-radius:7px; transition:left .15s;
}
.toggle.on .knob { left:22px; background:var(--bg); }
.toggle:not(.on) .knob { left:2px; }

/* Archive table */
.archive-table { width:100%; border-collapse:collapse; }
.archive-table th {
  text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  color:var(--dim); padding:8px 8px 8px 0; border-bottom:1px solid var(--border);
}
.archive-table td {
  padding:8px 8px 8px 0; border-bottom:1px solid var(--border);
  font-family:var(--mono); font-size:12px;
}

/* Positions */
.slot-bar { display:flex; gap:8px; margin-bottom:16px; }
.slot-card {
  flex:1; padding:14px; border:1px solid var(--border);
  background:var(--panel); border-radius:4px;
}
.slot-card.empty {
  border-style:dashed; background:transparent;
  display:flex; align-items:center; justify-content:center;
}

/* Section header */
.section-head {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px;
}
.section-head h2 { font-size:16px; font-weight:600; }
.section-head .sub { font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:2px; }

/* Pill badge */
.pill-badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 10px; font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  border:1px solid var(--blue); color:var(--blue); border-radius:3px;
  background:rgba(96,165,250,0.08);
}

/* Exit Alerts Banner */
.exit-alerts-banner {
  margin:0; padding:0 24px; border-bottom:1px solid rgba(248,113,113,0.3);
  background:rgba(248,113,113,0.04); flex-shrink:0;
}
.exit-alerts-banner .eab-header {
  display:flex; align-items:center; gap:8px; padding:10px 0 6px;
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--red);
}
.exit-alerts-banner .eab-dot {
  width:6px; height:6px; border-radius:50%; background:var(--red);
  animation:alert-pulse 1.5s ease-in-out infinite;
}
@keyframes alert-pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.exit-alerts-banner .eab-list { display:flex; flex-direction:column; gap:6px; padding-bottom:10px; }
.exit-alert-card {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; background:rgba(248,113,113,0.06);
  border:1px solid rgba(248,113,113,0.2); border-radius:3px;
}
.exit-alert-card .eac-left { display:flex; align-items:center; gap:12px; }
.exit-alert-card .eac-ticker { font-family:var(--mono); font-size:14px; font-weight:700; }
.exit-alert-card .eac-reason {
  font-family:var(--mono); font-size:10px; letter-spacing:.06em;
  padding:2px 6px; border-radius:2px; border:1px solid;
}
.exit-alert-card .eac-reason.stop { border-color:var(--red); color:var(--red); background:rgba(248,113,113,0.08); }
.exit-alert-card .eac-reason.ema { border-color:var(--amber); color:var(--amber); background:rgba(251,191,36,0.08); }
.exit-alert-card .eac-pnl { font-family:var(--mono); font-size:12px; font-weight:600; }
.exit-alert-card .eac-right { display:flex; align-items:center; gap:8px; }
.exit-alert-card .eac-archive-btn {
  padding:4px 10px; font-family:var(--mono); font-size:9px; letter-spacing:.08em;
  border:1px solid var(--border); background:transparent; color:var(--dim);
  cursor:pointer; border-radius:2px; transition:all .12s;
}
.exit-alert-card .eac-archive-btn:hover { border-color:var(--red); color:var(--red); }

/* Utility */
.text-green { color:var(--green); }
.text-red { color:var(--red); }
.text-amber { color:var(--amber); }
.text-dim { color:var(--dim); }
.text-faint { color:var(--faint); }
.font-mono { font-family:var(--mono); }
.font-bold { font-weight:700; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="header-left">
      <span class="header-brand">Atlas</span>
      <nav class="header-nav" id="nav"></nav>
    </div>
    <div class="header-right">
      <span class="regime-pill unknown" id="regimePill">--</span>
      <span id="spyPrice" style="font-family:var(--mono);font-size:11px;color:var(--dim)"></span>
      <span id="sectorCacheInfo" style="cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--faint)"></span>
      <span id="clock" style="font-family:var(--mono);font-size:11px;color:var(--dim)">NY --:--:--</span>
    </div>
  </header>
  <main class="main" id="main"></main>
</div>

<script>
// ===================================================================
// V5 STRATEGY PARAMETERS (validated through backtesting)
// ===================================================================
const RS_THRESHOLD = 0.08;
const RSI_LOW = 40;
const RSI_HIGH = 70;
const ATR_STOP_MULT = 2.5;
const TRAIL_ATR_MULT = 0.5;
const VOL_CONVICTION = 1.25;
const SECTOR_LOOKBACK = 63;
const SIGNAL_PERSIST_DAYS = 3;
let TOP_N_SECTORS = parseInt(localStorage.getItem('v5_hud_topN'))||2;

// ===================================================================
// SETTINGS PERSISTENCE
// ===================================================================
function loadPersonalWatchlist(){return (localStorage.getItem('v5_hud_personal')||'').split(',').map(t=>t.trim().toUpperCase()).filter(t=>t.length>1);}
function savePersonalWatchlist(tickers){localStorage.setItem('v5_hud_personal',tickers.join(','));}
function saveTopN(n){localStorage.setItem('v5_hud_topN',n);TOP_N_SECTORS=n;}

// ===================================================================
// SIGNAL HISTORY (persistence across days)
// ===================================================================
const SIGNAL_HISTORY_KEY = 'v5_hud_signal_history';

// ── Server sync helpers (write-through: localStorage = fast cache, server = durable) ──
function _postToServer(endpoint, data){
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{});
}
let _serverSynced=false;
async function syncFromServer(){
  try{
    const resp=await fetch('/v5/state');
    if(!resp.ok)return;
    const state=await resp.json();
    if(state.signal_history&&Object.keys(state.signal_history).length>0){
      localStorage.setItem(SIGNAL_HISTORY_KEY,JSON.stringify(state.signal_history));
    }
    if(state.monitor&&state.monitor.length>0){
      localStorage.setItem(MONITOR_KEY,JSON.stringify(state.monitor));
    }
    if(state.archive&&state.archive.length>0){
      localStorage.setItem(ARCHIVE_KEY,JSON.stringify(state.archive));
    }
    _serverSynced=true;
    console.log('[SYNC] Loaded state from server:',Object.keys(state.signal_history||{}).length,'history entries,',
      (state.monitor||[]).length,'monitor,',
      (state.archive||[]).length,'archive');
  }catch(e){
    console.warn('[SYNC] Server sync failed, using localStorage:',e.message);
  }
}

function getTradingDate(){
  const d=new Date();
  if(d.getDay()===0)d.setDate(d.getDate()-2);
  if(d.getDay()===6)d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function loadSignalHistory(){
  try{
    const raw=localStorage.getItem(SIGNAL_HISTORY_KEY);
    if(!raw)return {};
    return JSON.parse(raw);
  }catch{return {};}
}

function saveSignalHistory(history){
  try{localStorage.setItem(SIGNAL_HISTORY_KEY,JSON.stringify(history));}catch{}
  _postToServer('/v5/signal-history',history);
}

function recordSignals(todaySignals){
  const today=getTradingDate();
  const history=loadSignalHistory();
  for(const sig of todaySignals){
    if(!history[sig.tk]){
      history[sig.tk]={firstSeen:today,lastSeen:today,daysSeen:[today],lastData:sig};
    } else {
      history[sig.tk].lastSeen=today;
      history[sig.tk].lastData=sig;
      if(!history[sig.tk].daysSeen.includes(today))history[sig.tk].daysSeen.push(today);
    }
  }
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-14);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  for(const tk of Object.keys(history)){
    if(history[tk].lastSeen<cutoffStr)delete history[tk];
  }
  saveSignalHistory(history);
  return history;
}

function mergeWithHistory(todaySignals){
  const today=getTradingDate();
  const history=loadSignalHistory();
  const todayTickers=new Set(todaySignals.map(s=>s.tk));
  const merged=[];

  for(const sig of todaySignals){
    const hist=history[sig.tk];
    const age=hist&&hist.firstSeen!==today?tradingDaysBetween(hist.firstSeen,today):0;
    merged.push({...sig, signalAge:0, firstSeen:hist?hist.firstSeen:today,
      ageLabel:'FRESH', stillValid:true, consecutiveDays:hist?hist.daysSeen.length:1});
  }

  for(const [tk,hist] of Object.entries(history)){
    if(todayTickers.has(tk))continue;
    const age=tradingDaysBetween(hist.lastSeen,today);
    if(age>0&&age<=SIGNAL_PERSIST_DAYS){
      merged.push({...hist.lastData, signalAge:age, firstSeen:hist.firstSeen,
        ageLabel:age===1?'DAY 2':age===2?'DAY 3':'DAY '+String(age+1),
        stillValid:false, consecutiveDays:hist.daysSeen.length});
    }
  }

  return merged;
}

function tradingDaysBetween(dateA,dateB){
  const a=new Date(dateA+'T12:00:00'),b=new Date(dateB+'T12:00:00');
  if(a>=b)return 0;
  let count=0;
  const d=new Date(a);
  while(d<b){
    d.setDate(d.getDate()+1);
    if(d.getDay()!==0&&d.getDay()!==6)count++;
  }
  return count;
}

// ===================================================================
// SIGNAL MONITOR (forward-test tracker)
// ===================================================================
const MONITOR_KEY = 'v5_hud_monitor';
const ARCHIVE_KEY = 'v5_hud_monitor_archive';
const MONITOR_DAYS = 60;

function loadMonitor(){
  try{const raw=localStorage.getItem(MONITOR_KEY);return raw?JSON.parse(raw):[];}catch{return [];}
}
function saveMonitor(positions){
  try{localStorage.setItem(MONITOR_KEY,JSON.stringify(positions));}catch{}
  _postToServer('/v5/monitor',positions);
}
function loadArchive(){
  try{const raw=localStorage.getItem(ARCHIVE_KEY);return raw?JSON.parse(raw):[];}catch{return [];}
}
function saveArchive(archive){
  try{
    if(archive.length>100)archive=archive.slice(-100);
    localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive));
  }catch{}
  _postToServer('/v5/archive',archive);
}

function addToMonitor(signal){
  const positions=loadMonitor();
  if(positions.find(p=>p.tk===signal.tk&&p.status==='active'))return false;
  const pos={
    tk:signal.tk, sec:signal.sec||'XLK', entryPx:signal.px, entryDate:getTradingDate(),
    stopPx:signal.stop, trailPx:signal.trail, conv:signal.conv,
    rs21Entry:signal.rs21, rsiEntry:signal.rsi,
    pricePath:[{d:getTradingDate(),c:signal.px}],
    currentPx:signal.px, maxPx:signal.px, minPx:signal.px,
    daysHeld:0, pnlPct:0, maxGainPct:0, maxDDPct:0,
    stopHit:false, trailHit:false, rsStillValid:true, status:'active'
  };
  positions.push(pos);
  saveMonitor(positions);
  return true;
}

function removeFromMonitor(ticker){
  let positions=loadMonitor();
  positions=positions.filter(p=>p.tk!==ticker);
  saveMonitor(positions);
}

function autoTrackFreshSignals(freshSignals){
  const positions=loadMonitor();
  const activeTickers=new Set(positions.filter(p=>p.status==='active').map(p=>p.tk));
  let added=0;
  for(const sig of freshSignals){
    if(!activeTickers.has(sig.tk)){
      addToMonitor(sig);
      added++;
    }
  }
  return added;
}

function updateMonitorPositions(){
  const positions=loadMonitor();
  const today=getTradingDate();
  const toArchive=[];
  const remaining=[];

  for(const pos of positions){
    if(pos.status!=='active'){remaining.push(pos);continue;}

    const cached=_priceCache[pos.tk];
    if(cached&&cached.data&&cached.data.length>0){
      const bars=cached.data;
      const lastBar=bars[bars.length-1];
      const lastClose=lastBar.c;
      pos.currentPx=lastClose;
      pos.maxPx=Math.max(pos.maxPx,lastClose);
      pos.minPx=Math.min(pos.minPx,lastClose);
      pos.pnlPct=+((lastClose/pos.entryPx-1)*100).toFixed(2);
      pos.maxGainPct=+((pos.maxPx/pos.entryPx-1)*100).toFixed(2);
      pos.maxDDPct=+((pos.minPx/pos.entryPx-1)*100).toFixed(2);

      const lastPathDate=pos.pricePath.length>0?pos.pricePath[pos.pricePath.length-1].d:null;
      if(lastPathDate!==today){
        pos.pricePath.push({d:today,c:lastClose});
      } else {
        pos.pricePath[pos.pricePath.length-1].c=lastClose;
      }

      if(lastClose<=pos.stopPx)pos.stopHit=true;

      const closes=bars.map(b=>b.c);
      if(closes.length>=21){
        const ema21=computeEMA(closes,21);
        const ema21Val=ema21[ema21.length-1];
        if(lastClose<ema21Val)pos.trailHit=true;
        pos.trailPx=+(ema21Val-TRAIL_ATR_MULT*computeATR(bars.map(b=>b.h),bars.map(b=>b.l),closes,14)).toFixed(2);
      }

      if(closes.length>=22){
        const spyCached=_priceCache['SPY'];
        if(spyCached&&spyCached.data){
          const spyCloses=spyCached.data.map(b=>b.c);
          const stockRet=closes[closes.length-1]/closes[closes.length-22]-1;
          const spyRet=spyCloses[spyCloses.length-1]/spyCloses[spyCloses.length-22]-1;
          pos.rsStillValid=(stockRet-spyRet)>=RS_THRESHOLD;
        }
      }
    }

    pos.daysHeld=tradingDaysBetween(pos.entryDate,today);

    if(pos.daysHeld>=MONITOR_DAYS){
      pos.status='archived';
      pos.archiveDate=today;
      toArchive.push(pos);
    } else {
      remaining.push(pos);
    }
  }

  saveMonitor(remaining);

  if(toArchive.length>0){
    const archive=loadArchive();
    archive.push(...toArchive);
    saveArchive(archive);
  }

  return {active:remaining.filter(p=>p.status==='active'),archived:loadArchive()};
}

function genCurve(months,finalRet,mdd,seed=1){const out=[{m:0,v:100}];let v=100,peak=100,rng=seed;const rand=()=>{rng=(rng*9301+49297)%233280;return rng/233280;};for(let i=1;i<=months;i++){const drift=finalRet/months,vol=0.038+rand()*0.015,shock=(rand()-0.5)*2*vol;v*=(1+drift+shock);if(i%9===4)v*=(1-mdd*0.4*rand());peak=Math.max(peak,v);out.push({m:i,v:+v.toFixed(2),peak:+peak.toFixed(2),dd:+((v/peak-1)*100).toFixed(2)});}return out;}

function computeEMA(closes,span){const k=2/(span+1);let ema=[closes[0]];for(let i=1;i<closes.length;i++)ema.push(closes[i]*k+ema[i-1]*(1-k));return ema;}
function computeRSI(closes,period=14){let gains=[],losses=[];for(let i=1;i<closes.length;i++){const d=closes[i]-closes[i-1];gains.push(d>0?d:0);losses.push(d<0?-d:0);}const alpha=1/period;let avgGain=gains.slice(0,period).reduce((a,b)=>a+b,0)/period;let avgLoss=losses.slice(0,period).reduce((a,b)=>a+b,0)/period;let rsi=[];for(let i=0;i<=period;i++)rsi.push(null);rsi.push(avgLoss===0?100:100-100/(1+avgGain/avgLoss));for(let i=period;i<gains.length;i++){avgGain=avgGain*(1-alpha)+gains[i]*alpha;avgLoss=avgLoss*(1-alpha)+losses[i]*alpha;rsi.push(avgLoss===0?100:100-100/(1+avgGain/avgLoss));}return rsi;}
function computeATR(highs,lows,closes,period=14){let trs=[];for(let i=1;i<closes.length;i++)trs.push(Math.max(highs[i]-lows[i],Math.abs(highs[i]-closes[i-1]),Math.abs(lows[i]-closes[i-1])));let avg=trs.slice(0,period).reduce((a,b)=>a+b,0)/period;const alpha=1/period;for(let i=period;i<trs.length;i++)avg=avg*(1-alpha)+trs[i]*alpha;return avg;}

const PRICE_CACHE_KEY = 'v5_hud_price_cache';
const PRICE_CACHE_TTL = 30*60*1000;
const PRICE_CACHE_MAX_ENTRIES = 200;
const PRICE_CACHE_STALE_TTL = 48*60*60*1000;

function loadPriceCache(){
  try{
    const raw=localStorage.getItem(PRICE_CACHE_KEY);
    if(!raw)return {};
    const stored=JSON.parse(raw);
    const now=Date.now();
    const valid={};
    for(const [ticker,entry] of Object.entries(stored)){
      if(entry&&entry.ts&&(now-entry.ts<PRICE_CACHE_STALE_TTL)){valid[ticker]=entry;}
    }
    return valid;
  }catch{return {};}
}

function isCacheFresh(entry){
  return entry&&entry.ts&&(Date.now()-entry.ts<PRICE_CACHE_TTL);
}

function savePriceCache(cache){
  try{
    const keys=Object.keys(cache);
    if(keys.length>PRICE_CACHE_MAX_ENTRIES){
      const sorted=keys.sort((a,b)=>cache[b].ts-cache[a].ts);
      const trimmed={};
      for(let i=0;i<PRICE_CACHE_MAX_ENTRIES;i++){trimmed[sorted[i]]=cache[sorted[i]];}
      localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify(trimmed));
      return;
    }
    localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify(cache));
  }catch(e){
    try{localStorage.removeItem(PRICE_CACHE_KEY);localStorage.setItem(PRICE_CACHE_KEY,JSON.stringify(cache));}catch{}
  }
}

function deepParse(val){if(typeof val==='string'){try{return deepParse(JSON.parse(val));}catch{return val;}}if(val&&typeof val==='object'){if('isError' in val&&val.isError)return{_error:true};if('result' in val)return deepParse(val.result);if('content' in val&&Array.isArray(val.content)&&val.content.length>0){if(val.content[0].text)return deepParse(val.content[0].text);}}return val;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

let _throttleMs = 350;
let _consecutiveErrors = 0;
const THROTTLE_MIN = 300;
const THROTTLE_MAX = 3000;
const THROTTLE_STEP = 200;

function adaptThrottle(success){
  if(success){_consecutiveErrors=0;_throttleMs=Math.max(THROTTLE_MIN,_throttleMs-30);}
  else{_consecutiveErrors++;_throttleMs=Math.min(THROTTLE_MAX,_throttleMs+THROTTLE_STEP*_consecutiveErrors);}
}

let _fetchLog=[];
function logFetch(ticker,attempt,outcome,detail){
  _fetchLog.push({t:Date.now(),ticker,attempt,outcome,detail:String(detail).slice(0,120)});
  if(_fetchLog.length>30)_fetchLog.shift();
}

async function fetchAggregates(ticker, limit=65){
  const cached=_priceCache[ticker];
  if(cached&&isCacheFresh(cached)){liveState.fetchStats.cached++;return cached.data;}

  const to=new Date(),from=new Date();
  from.setDate(from.getDate()-Math.round(limit*1.7));
  const fromStr=from.toISOString().slice(0,10),toStr=to.toISOString().slice(0,10);

  for(let attempt=1;attempt<=2;attempt++){
    try{
      await sleep(_throttleMs);
      const raw=await window.cowork.callMcpTool('mcp__polygon__polygon_aggregates',{params:{ticker,from_date:fromStr,to_date:toStr,timespan:'day',adjusted:true,limit:150,response_format:'json'}});
      const parsed=deepParse(raw);

      if(parsed&&parsed._error){
        logFetch(ticker,attempt,'ERROR','isError flag in response');
        adaptThrottle(false);
        if(attempt<2){await sleep(2000);continue;}
        break;
      }

      if(parsed&&typeof parsed==='object'&&parsed.status==='ERROR'){
        logFetch(ticker,attempt,'RATE_LIMIT',parsed.error||parsed.message||'status=ERROR');
        adaptThrottle(false);
        if(attempt<2){await sleep(3000);continue;}
        break;
      }

      let results=null;
      if(parsed&&parsed.results&&Array.isArray(parsed.results))results=parsed.results;
      else if(Array.isArray(parsed))results=parsed;
      else if(parsed&&parsed.resultsCount===0){
        logFetch(ticker,attempt,'NO_DATA','resultsCount=0');
        liveState.fetchStats.ok++;
        adaptThrottle(true);
        return null;
      }

      if(results&&results.length>=20){
        const sorted=results.sort((a,b)=>a.t-b.t);
        cachePut(ticker,sorted);
        liveState.fetchStats.ok++;
        adaptThrottle(true);
        logFetch(ticker,attempt,'OK',results.length+' bars');
        return sorted;
      }

      if(results&&results.length>0&&results.length<20){
        logFetch(ticker,attempt,'PARTIAL',results.length+' bars (need 20)');
        liveState.fetchStats.ok++;
        adaptThrottle(true);
        return null;
      }

      logFetch(ticker,attempt,'EMPTY','parsed type: '+typeof parsed+' keys: '+(parsed?Object.keys(parsed).slice(0,5).join(','):'null'));
      if(attempt<2){adaptThrottle(false);await sleep(1500);continue;}
      break;

    }catch(e){
      logFetch(ticker,attempt,'EXCEPTION',e.message||e);
      adaptThrottle(false);
      if(attempt<2){await sleep(2500);continue;}
      break;
    }
  }

  if(cached&&cached.data){
    logFetch(ticker,0,'STALE_CACHE','using cached data from '+new Date(cached.ts).toLocaleTimeString());
    liveState.fetchStats.cached++;
    return cached.data;
  }

  liveState.fetchStats.failed++;
  return null;
}

const API_BASE = window.location.origin.includes('localhost')
  ? 'http://localhost:8000'
  : window.location.origin;

async function runLiveScan(){
  if(liveState.scanRunning)return;
  try{
  liveState.scanRunning=true; liveState.scanProgress=0;
  liveState.scanPhase='Connecting to backend...';
  liveState.fetchStats={ok:0,failed:0,cached:0}; render();

  const personalTickers=loadPersonalWatchlist();
  const body={force:false, top_n:TOP_N_SECTORS, personal_watchlist:personalTickers};

  liveState.scanPhase='Scanning S&P 500 (backend)...'; liveState.scanProgress=10; render();

  const resp=await fetch(`${API_BASE}/v5/scan`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),
  });

  if(!resp.ok){
    const err=await resp.text();
    throw new Error(`API ${resp.status}: ${err}`);
  }

  const data=await resp.json();
  liveState.scanProgress=80; liveState.scanPhase='Processing results...'; render();

  liveState.regime=data.regime;
  liveState.sectors=data.sectors;

  const topSectors=data.sectors.filter(s=>s.top).map(s=>s.etf);
  ENTRY_RULES[5].v=topSectors.join(' / ');
  ENTRY_RULES[4].v=(data.regime?.state||'?')+' regime';

  const signals=data.signals||[];
  recordSignals(signals);
  const mergedSignals=mergeWithHistory(signals);
  mergedSignals.sort((a,b)=>{
    if(a.stillValid&&!b.stillValid)return -1;
    if(!a.stillValid&&b.stillValid)return 1;
    if(a.signalAge!==b.signalAge)return a.signalAge-b.signalAge;
    return b.rs21-a.rs21;
  });
  liveState.signals=mergedSignals;

  liveState.weeklyPerformers=data.weeklyPerformers||[];

  liveState.personalSignals=data.personalSignals||[];
  liveState.personalStatus=data.personalStatus||[];

  liveState.scanProgress=95; liveState.scanPhase='Updating monitor...'; render();
  const freshSignalsOnly=mergedSignals.filter(s=>s.stillValid);
  const tracked=autoTrackFreshSignals(freshSignalsOnly);
  updateMonitorPositions();

  liveState.scanRunning=false;
  liveState.scanProgress=100;
  const freshCount=mergedSignals.filter(s=>s.stillValid).length;
  const fadingCount=mergedSignals.filter(s=>!s.stillValid).length;
  const meta=data.meta||{};
  const barLabel=meta.market_closed?`EOD ${meta.bar_date||''}`:`Pre-close ${meta.bar_date||''}`;
  liveState.scanPhase=`${barLabel} | ${meta.universe_size||'?'} tickers | ${freshCount} fresh${fadingCount>0?' + '+fadingCount+' persisted':''}${(data.personalSignals||[]).length>0?' + '+data.personalSignals.length+' personal':''}${tracked>0?' | '+tracked+' tracked':''} (${meta.duration_seconds||'?'}s)`;
  liveState.lastScan=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  liveState.fetchStats.ok=1;
  render();
  }catch(scanErr){
    console.error('Scan error:',scanErr);
    liveState.scanRunning=false;
    liveState.scanPhase=`Scan failed: ${scanErr.message}`;
    render();
  }
}

function renderSparkLine(data,w=100,h=24){
  if(!data||!Array.isArray(data)||data.length<2)return`<svg width="${w}" height="${h}" style="display:block"><text x="${w/2}" y="${h/2+3}" text-anchor="middle" font-size="9" fill="#374151">--</text></svg>`;
  const min=Math.min(...data),max=Math.max(...data);
  const range=max-min||1;
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*w;
    const y=h-2-((v-min)/range)*(h-4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const fillPts=`${pts.join(' ')} ${w},${h} 0,${h}`;
  const color=data[data.length-1]>=data[0]?'#34d399':'#f87171';
  const gradId='sg'+Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" style="display:block"><defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.2"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${fillPts}" fill="url(#${gradId})"/><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.2"/></svg>`;
}

function renderMonitorSparkline(pricePath,entryPx,w=140,h=36){
  if(!pricePath||pricePath.length<2)return `<svg width="${w}" height="${h}" style="display:block"><text x="${w/2}" y="${h/2+4}" text-anchor="middle" font-size="9" fill="#374151">awaiting data</text></svg>`;
  const prices=pricePath.map(p=>p.c);
  const min=Math.min(...prices,entryPx);const max=Math.max(...prices,entryPx);
  const range=max-min||1;
  const xStep=w/(prices.length-1);
  const points=prices.map((p,i)=>`${(i*xStep).toFixed(1)},${(h-((p-min)/range)*(h-4)-2).toFixed(1)}`).join(' ');
  const entryY=(h-((entryPx-min)/range)*(h-4)-2).toFixed(1);
  const lastPx=prices[prices.length-1];
  const color=lastPx>=entryPx?'var(--green)':'var(--red)';
  return `<svg width="${w}" height="${h}" style="display:block">
    <line x1="0" y1="${entryY}" x2="${w}" y2="${entryY}" stroke="var(--dim)" stroke-width="0.5" stroke-dasharray="3,3"/>
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"/>
    <circle cx="${((prices.length-1)*xStep).toFixed(1)}" cy="${(h-((lastPx-min)/range)*(h-4)-2).toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

function renderEquityChart(strategy,benchmark,h=240){
  const w=800,pad={l:50,r:12,t:20,b:28};const allV=[...strategy.map(p=>p.v),...(benchmark||[]).map(p=>p.v)];
  const max=Math.max(...allV),min=Math.min(...allV,80);
  const xs=(i,n)=>pad.l+(i/(n-1))*(w-pad.l-pad.r);const ys=v=>pad.t+(1-(v-min)/(max-min))*(h-pad.t-pad.b);
  const lp=arr=>arr.map((p,i)=>`${i?'L':'M'}${xs(i,arr.length).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ');
  const fp=arr=>`${lp(arr)} L${xs(arr.length-1,arr.length).toFixed(1)},${ys(min).toFixed(1)} L${xs(0,arr.length).toFixed(1)},${ys(min).toFixed(1)} Z`;
  const ticks=4;const yL=Array.from({length:ticks+1},(_,i)=>min+(max-min)*(i/ticks));
  let g='';yL.forEach(y=>{g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${ys(y)}" y2="${ys(y)}" stroke="#1e293b" stroke-dasharray="2 4"/><text x="${pad.l-8}" y="${ys(y)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="#6b7280">${y.toFixed(0)}</text>`;});
  let bl='';if(benchmark)bl=`<path d="${lp(benchmark)}" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>`;
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.15"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/></linearGradient></defs>${g}${bl}<path d="${fp(strategy)}" fill="url(#eqfill)"/><path d="${lp(strategy)}" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function renderDrawdownChart(data,h=80){
  const w=800,pad={l:50,r:12,t:8,b:12};const minDd=Math.min(...data.map(p=>p.dd||0),-25);
  const xs=i=>pad.l+(i/(data.length-1))*(w-pad.l-pad.r);const ys=v=>pad.t+(1-(v-minDd)/(0-minDd))*(h-pad.t-pad.b);
  const lp=data.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(p.dd||0).toFixed(1)}`).join(' ');
  const fp=`${lp} L${xs(data.length-1).toFixed(1)},${ys(0).toFixed(1)} L${xs(0).toFixed(1)},${ys(0).toFixed(1)} Z`;
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><line x1="${pad.l}" x2="${w-pad.r}" y1="${ys(0)}" y2="${ys(0)}" stroke="#1e293b"/><line x1="${pad.l}" x2="${w-pad.r}" y1="${ys(-20)}" y2="${ys(-20)}" stroke="#f87171" stroke-dasharray="2 4" opacity="0.4"/><text x="${pad.l-8}" y="${ys(0)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="#6b7280">0%</text><text x="${pad.l-8}" y="${ys(-20)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="#f87171">-20%</text><path d="${fp}" fill="#f87171" fill-opacity="0.12"/><path d="${lp}" fill="none" stroke="#f87171" stroke-width="1.2"/></svg>`;
}
function renderHistogram(data,h=180){
  const w=560,pad={l:20,r:12,t:14,b:24};const max=Math.max(...data.map(d=>d.count));const bw=(w-pad.l-pad.r)/data.length;
  let bars='';data.forEach((d,i)=>{const bh=(d.count/max)*(h-pad.t-pad.b);const x=pad.l+i*bw+3;const isL=d.bucket.startsWith('-');const col=isL?'#f87171':'#34d399';
  bars+=`<rect x="${x}" y="${h-pad.b-bh}" width="${bw-6}" height="${bh}" fill="${col}" opacity="0.8" rx="1"/><text x="${x+(bw-6)/2}" y="${h-pad.b-bh-5}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="${col}">${d.count}</text><text x="${x+(bw-6)/2}" y="${h-6}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="#6b7280">${d.bucket}</text>`;});
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">${bars}</svg>`;
}

// ===================================================================
// SORTING
// ===================================================================
function getSortValue(sig,col){
  switch(col){
    case 'ticker': return sig.tk;
    case 'price': return sig.px;
    case 'chg': return sig.chg||0;
    case 'rs21': return sig.rs21||0;
    case 'rsi': return sig.rsi||0;
    case 'conv': return sig.conv==='CONVICTION'?1:0;
    case 'stop': return sig.stop||0;
    case 'status': return sig.signalAge||0;
    default: return 0;
  }
}

function sortSignals(signals){
  if(!sortCol)return signals;
  const arr=[...signals];
  arr.sort((a,b)=>{
    let va=getSortValue(a,sortCol), vb=getSortValue(b,sortCol);
    if(typeof va==='string') return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    return sortDir==='asc'?va-vb:vb-va;
  });
  return arr;
}

function filterSignals(signals){
  switch(filterMode){
    case 'conviction': return signals.filter(s=>s.conv==='CONVICTION');
    case 'base': return signals.filter(s=>s.conv!=='CONVICTION');
    case 'fresh': return signals.filter(s=>s.stillValid||s.stillValid===undefined);
    default: return signals;
  }
}

function renderPositions(){
  const positions=liveState.positions;
  const totalPnl=positions.reduce((a,p)=>a+(p.pnl||0),0);
  const totalRisk=positions.reduce((a,p)=>a+(p.risk||0),0);
  return`
    <div class="section-head">
      <div>
        <h2>Positions</h2>
        <div class="sub">${positions.length} of ${maxPos} open | Unrealized: ${totalPnl>=0?'+':''}$${totalPnl.toFixed(0)} | Risk: ${totalRisk}%</div>
      </div>
    </div>
    <div class="slot-bar">${Array.from({length:maxPos}).map((_,i)=>{
      const p=positions[i];
      if(!p)return`<div class="slot-card empty"><span style="font-family:var(--mono);font-size:10px;color:var(--faint)">SLOT ${i+1}</span></div>`;
      return`<div class="slot-card"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:16px;font-weight:700">${p.tk}</span><span style="font-family:var(--mono);font-size:10px;color:var(--amber)">${p.risk}%</span></div></div>`;
    }).join('')}</div>
    <div style="padding:40px;text-align:center;color:var(--dim);font-size:13px">Position tracking available after broker integration.</div>`;
}

function renderMonitor(){
  const {active,archived}=updateMonitorPositions();
  const winners=active.filter(p=>p.pnlPct>=0);
  const losers=active.filter(p=>p.pnlPct<0);
  const avgPnl=active.length>0?active.reduce((s,p)=>s+p.pnlPct,0)/active.length:0;
  const totalArchived=archived.length;
  const archiveWins=archived.filter(p=>p.pnlPct>0).length;
  const archiveWinRate=totalArchived>0?Math.round(archiveWins/totalArchived*100):0;
  const archiveAvgPnl=totalArchived>0?archived.reduce((s,p)=>s+p.pnlPct,0)/totalArchived:0;

  return `
    <div class="section-head">
      <div>
        <h2>Monitor</h2>
        <div class="sub">Forward test tracker. Auto-tracks FRESH signals for ${MONITOR_DAYS} days. Run scan to update.</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <input id="monitorAddInput" type="text" placeholder="Add ticker..." style="padding:5px 10px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;width:110px;border-radius:2px;outline:none"/>
        <button id="monitorAddBtn" class="scan-btn" style="font-size:10px;padding:5px 12px">+ ADD</button>
      </div>
    </div>

    <div class="summary-strip">
      <div class="ss-cell"><div class="ss-label">ACTIVE</div><div class="ss-value" style="color:var(--green)">${active.length}</div></div>
      <div class="ss-cell"><div class="ss-label">WINNERS</div><div class="ss-value" style="color:var(--green)">${winners.length}</div></div>
      <div class="ss-cell"><div class="ss-label">LOSERS</div><div class="ss-value" style="color:var(--red)">${losers.length}</div></div>
      <div class="ss-cell"><div class="ss-label">AVG P&L</div><div class="ss-value" style="color:${avgPnl>=0?'var(--green)':'var(--red)'}">${avgPnl>=0?'+':''}${avgPnl.toFixed(1)}%</div></div>
      <div class="ss-cell"><div class="ss-label">ARCHIVED</div><div class="ss-value">${totalArchived}</div></div>
      <div class="ss-cell"><div class="ss-label">WIN RATE</div><div class="ss-value" style="color:var(--amber)">${totalArchived>0?archiveWinRate+'%':'--'}</div></div>
    </div>

    ${active.length===0?`<div style="padding:48px 40px;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:4px">
      <div style="font-family:var(--mono);font-size:12px;color:var(--dim)">NO ACTIVE POSITIONS</div>
      <div style="margin-top:6px;font-size:13px;color:var(--faint)">Run a scan -- FRESH signals are auto-tracked here for ${MONITOR_DAYS} days.</div>
    </div>`:`
    <div class="monitor-grid">
      ${active.map(p=>{
        const pnlColor=p.pnlPct>=0?'var(--green)':'var(--red)';
        const cardClass=p.pnlPct>=0?'winner':'loser';
        return `<div class="monitor-card ${cardClass}">
          <button class="mc-remove" data-tk="${p.tk}" title="Remove">x</button>
          <div class="mc-head">

            <span class="mc-pnl" style="color:${pnlColor}">${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(1)}%</span>
          </div>
          <div style="margin-bottom:10px">${renderMonitorSparkline(p.pricePath,p.entryPx)}</div>
          <div class="mc-meta">
            <div><div class="mc-k">ENTRY</div><div class="mc-v">$${p.entryPx.toFixed(2)}</div></div>

          <tbody>${archived.slice().reverse().map(p=>{
            const pnlColor=p.pnlPct>=0?'var(--green)':'var(--red)';
            return `<tr>
              <td style="font-weight:700">${p.tk}</td>
              <td style="color:var(--dim)">${p.entryDate}</td>
              <td>$${p.entryPx.toFixed(2)}</td>
              <td style="color:${pnlColor}">$${p.currentPx.toFixed(2)}</td>
              <td style="color:var(--dim)">${p.daysHeld}d</td>
              <td style="color:${pnlColor}">${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(1)}%</td>
              <td style="color:var(--red)">${p.maxDDPct.toFixed(1)}%</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`:''}`;
}

    {k:'SHARPE',v:stats.sharpe.toFixed(2),sub:backtestPeriod==='oos'?`IS ${PERF.is.sharpe.toFixed(2)}`:`OOS ${PERF.oos.sharpe.toFixed(2)}`},
    {k:'MAX DD',v:`${stats.mdd.toFixed(0)}%`,sub:'expected',color:'var(--amber)'},

        </div>
        <div style="background:var(--panel);border:1px solid var(--border);padding:16px;border-radius:4px;margin-top:12px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;margin-bottom:10px">EXIT RULES</div>
          ${[{k:'INITIAL STOP',v:'Entry - 2.5xATR(14)'},{k:'TRAILING STOP',v:'EMA21 - 0.5xATR(14)'},{k:'TREND EXIT',v:'Close < EMA21'},{k:'TIME STOP',v:'None',muted:true}].map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11px">
            <span style="color:${r.muted?'var(--faint)':'var(--dim)'}">${r.k}</span>
            <span style="color:${r.muted?'var(--faint)':'var(--text)'}">${r.v}</span>
          </div>`).join('')}
        </div>
        <div style="background:var(--panel);border:1px solid var(--border);padding:16px;border-radius:4px;margin-top:12px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;margin-bottom:10px">STRATEGY EVOLUTION</div>
          ${VERSIONS.map(v=>`<div style="display:grid;grid-template-columns:36px 1fr 1fr;padding:6px 0;border-bottom:1px solid var(--border);align-items:baseline;font-family:var(--mono);font-size:11px">
            <span style="font-weight:700;color:${v.v==='V5'?'var(--blue)':'var(--faint)'}">${v.v}</span>
            <span style="color:${v.v==='V5'?'var(--text)':'var(--dim)'}">${v.change}</span>
            <span style="color:${v.v==='V5'?'var(--green)':'var(--dim)'};text-align:right">${v.result}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
}

// ===================================================================
// EXIT ALERTS BANNER
// ===================================================================
function getExitAlerts(){
  const positions=loadMonitor();
  return positions.filter(p=>p.status==='stopped'||p.status==='exit_signal');
}

function renderExitAlerts(){
  const alerts=getExitAlerts();
  if(alerts.length===0)return '';
  return `<div class="exit-alerts-banner">
    <div class="eab-header">
      <span class="eab-dot"></span>
      <span>EXIT ALERTS — ${alerts.length} position${alerts.length>1?'s':''} flagged</span>
    </div>
    <div class="eab-list">
      ${alerts.map(p=>{
        const isStopped=p.status==='stopped';
        const reasonClass=isStopped?'stop':'ema';
        const reasonText=isStopped?'STOP HIT':'BELOW EMA21';
        const entryPx=p.entryPx||p.entryPrice||0;
        const currentPx=p.currentPrice||p.currentPx||0;
        const pnl=p.currentPnl!=null?p.currentPnl:(p.pnlPct!=null?p.pnlPct:(entryPx?((currentPx/entryPx-1)*100):0));
        const pnlColor=pnl>=0?'var(--green)':'var(--red)';
        return `<div class="exit-alert-card">
          <div class="eac-left">
            <span class="eac-ticker">${p.tk}</span>
            <span class="eac-reason ${reasonClass}">${reasonText}</span>
            <span style="font-family:var(--mono);font-size:11px;color:var(--dim)">Entry $${entryPx.toFixed(2)} → $${currentPx.toFixed(2)}</span>
          </div>
          <div class="eac-right">
            <span class="eac-pnl" style="color:${pnlColor}">${pnl>=0?'+':''}${pnl.toFixed(1)}%</span>
            <button class="eac-archive-btn" data-exit-tk="${p.tk}">ARCHIVE</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function archiveExitPosition(ticker){
  let positions=loadMonitor();
  const pos=positions.find(p=>p.tk===ticker);
  if(!pos)return;
  const reason=pos.status==='stopped'?'stop_hit':'ema21_exit';
  pos.status='archived';
  pos.archiveDate=getTradingDate();
  pos.archiveReason=reason;
  positions=positions.filter(p=>p.tk!==ticker);
  saveMonitor(positions);
  const archive=loadArchive();
  archive.push(pos);
  saveArchive(archive);
  render();
}

function render(){
  renderNav();
  const main=document.getElementById('main');
  let html='';
  switch(currentView){
    case'screener':html=renderScreener();break;
    case'monitor':html=renderMonitor();break;
    case'positions':html=renderPositions();break;
    case'backtest':html=renderBacktest();break;
    case'strategy':html=renderStrategy();break;
  }
  const alertsHtml=renderExitAlerts();
  main.innerHTML=`${alertsHtml}<div class="view active">${html}</div>`;
  bindEvents();
}

function bindEvents(){
  // Signal rows - expand inline
  document.querySelectorAll('tr.signal-row').forEach(row=>row.addEventListener('click',()=>{
    const tk=row.dataset.tk;
    expandedTicker=expandedTicker===tk?'':tk;
    render();
  }));

  // Sort headers
  document.querySelectorAll('.signal-table th[data-sort]').forEach(th=>th.addEventListener('click',(e)=>{
    e.stopPropagation();
    const col=th.dataset.sort;
    if(sortCol===col){
      sortDir=sortDir==='asc'?'desc':'asc';
    } else {
      sortCol=col;
      sortDir='desc';
    }
    render();
  }));

  // Filter chips
  document.querySelectorAll('.filter-chip[data-filter]').forEach(chip=>chip.addEventListener('click',()=>{
    filterMode=chip.dataset.filter;
    render();
  }));

  // Period toggle
  document.querySelectorAll('.period-toggle button').forEach(btn=>btn.addEventListener('click',()=>{backtestPeriod=btn.dataset.period;render();}));

  // Rule toggles
  document.querySelectorAll('.toggle[data-rule]').forEach(btn=>btn.addEventListener('click',()=>{ruleStates[+btn.dataset.rule]=!ruleStates[+btn.dataset.rule];render();}));

  // Sliders
  document.querySelectorAll('input[data-slider]').forEach(sl=>sl.addEventListener('input',()=>{
    if(sl.dataset.slider==='conv')convPct=+sl.value;
    if(sl.dataset.slider==='base')basePct=+sl.value;
    if(sl.dataset.slider==='maxpos')maxPos=+sl.value;
    render();
  }));

  // Scan button
  const scanBtn=document.getElementById('scanBtn');
  if(scanBtn)scanBtn.addEventListener('click',()=>runLiveScan());

  // Fetch log viewer
  const fsd=document.getElementById('fetchStatsDisplay');
  if(fsd)fsd.addEventListener('click',()=>{
    const logHtml=_fetchLog.length===0?'No fetch log yet.':_fetchLog.map(l=>`<div style="font-size:10px;padding:2px 0;border-bottom:1px solid var(--border);color:${l.outcome==='OK'?'var(--green)':l.outcome==='PARTIAL'||l.outcome==='NO_DATA'?'var(--dim)':'var(--red)'}"><b>${l.ticker}</b> #${l.attempt} -> ${l.outcome} | ${l.detail}</div>`).join('');
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)';
    modal.innerHTML=`<div style="background:var(--panel);border:1px solid var(--border);padding:16px;max-width:560px;max-height:60vh;overflow:auto;width:90%;border-radius:4px"><div style="font-family:var(--mono);font-size:11px;color:var(--blue);letter-spacing:.1em;margin-bottom:10px">FETCH LOG (${_fetchLog.length})</div>${logHtml}<div style="margin-top:12px;text-align:right"><button onclick="this.closest('div[style*=fixed]').remove()" style="padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer;border-radius:2px">CLOSE</button></div></div>`;
    document.body.appendChild(modal);
  });

  // Top-N selector
  const topNSel=document.getElementById('topNSelect');
  if(topNSel)topNSel.addEventListener('change',()=>{saveTopN(parseInt(topNSel.value));});

  // Personal watchlist
  const pwInput=document.getElementById('personalInput');
  if(pwInput){
    pwInput.addEventListener('blur',()=>{const tks=pwInput.value.split(/[,\s]+/).map(t=>t.trim().toUpperCase()).filter(t=>t.length>1);savePersonalWatchlist(tks);});
    pwInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'){pwInput.blur();}});
  }

  // Add to Monitor buttons (inline expand)
  document.querySelectorAll('[id^="addMonitorBtn_"]').forEach(btn=>{
    const tk=btn.id.replace('addMonitorBtn_','');
    const sig=liveState.signals.find(s=>s.tk===tk);
    if(sig){
      const alreadyTracked=loadMonitor().find(p=>p.tk===tk&&p.status==='active');
      if(alreadyTracked){btn.textContent='Tracking';btn.style.opacity='0.5';btn.disabled=true;}
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(addToMonitor(sig)){btn.textContent='Tracked';btn.style.opacity='0.5';renderNav();}
      });
    }
  });

  // Monitor remove buttons
  document.querySelectorAll('.mc-remove').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    removeFromMonitor(btn.dataset.tk);
    render();
  }));

  // Exit alert archive buttons
  document.querySelectorAll('.eac-archive-btn').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    archiveExitPosition(btn.dataset.exitTk);
  }));

  // Monitor manual add
  const monAddInput=document.getElementById('monitorAddInput');
  const monAddBtn=document.getElementById('monitorAddBtn');
  if(monAddBtn&&monAddInput){
    monAddBtn.addEventListener('click',()=>{
      const tk=monAddInput.value.trim().toUpperCase();
      if(tk.length>0){
        const cached=_priceCache[tk];
        const px=cached&&cached.data?cached.data[cached.data.length-1].c:0;
        addToMonitor({tk,sec:getSector(tk)||'XLK',px,stop:px*0.9,trail:px*0.95,conv:'MANUAL',rs21:0,rsi:0,spark:[]});
        monAddInput.value='';
        render();
      }
    });
    monAddInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')monAddBtn.click();});
  }
}

// Clock
function updateClock(){
  const now=new Date();
  const ny=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  document.getElementById('clock').textContent=`NY ${ny}`;
}
setInterval(updateClock,1000);updateClock();

// Initial render: sync from server first, then render + auto-scan
(async()=>{
  await syncFromServer();
  render();
  setTimeout(()=>{runLiveScan();},1000);
})();
</script>
